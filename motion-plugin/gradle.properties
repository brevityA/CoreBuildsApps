org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# The vendored Projectivy API relies on Kotlin Parcelize generation, which is
# not wired into AGP's built-in Kotlin tasks; use KGP 2.4.10, which supports AGP 9.4.
android.builtInKotlin=false
# Kotlin Gradle Plugin 2.4.10 still consumes AGP's legacy Android DSL.
android.newDsl=false
kotlin.code.style=official

# AGP 9 defaults to debug-only unit-test components. suite-release.yml names
# :app:testReleaseUnitTest, so retain a component for the release build too.
android.onlyEnableUnitTestForTheTestedBuildType=false
