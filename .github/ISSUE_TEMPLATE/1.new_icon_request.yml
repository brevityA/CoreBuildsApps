name: "🎨 New icon request"
description: Request an icon for an app that isn't in the pack yet.
title: "[Icon] "
labels: ["icon request"]
body:
  - type: markdown
    attributes:
      value: |
        One app per issue, please — it keeps the queue countable.

        Before opening: check [docs/IconPackList.md](https://github.com/brevityA/CoreBuildsApps/blob/main/docs/IconPackList.md) by name, drawable and package (for example, ZEE5 is `graymatrix`). If the app is listed but the icon isn't applying, use the **Icon not auto-assigning** template instead.

  - type: input
    id: app_name
    attributes:
      label: App name
      description: Exactly as it appears in the launcher.
      placeholder: Example TV
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component name
      description: |
        The package + actual TV launcher activity. Prefer:
        `adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LEANBACK_LAUNCHER com.example.tv`
        If you cannot obtain it, leave this blank and provide an official APK link below so it can be statically inspected. Do not guess MainActivity.
      placeholder: com.example.tv/com.vendor.tv.LaunchActivity
    validations:
      required: false

  - type: input
    id: store_link
    attributes:
      label: Store or download link
      description: Prefer the official APK, official site, or Play Store. Include the app version/region in the notes; a real APK can supply both the logo and launcher mapping.
      placeholder: https://play.google.com/store/apps/details?id=com.example.tv
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device type
      options:
        - Android TV / Google TV
        - Fire TV
        - Nvidia Shield
        - TV box (generic)
        - Other
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Brand colour, a screenshot of the app's icon, or a note if it ships regional variants.
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: I checked docs/IconPackList.md and this app isn't already covered.
          required: true
