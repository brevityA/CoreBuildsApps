name: Build restricted icon pack test APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit or ref to test (defaults to the selected workflow ref)"
        required: false
        type: string
        default: ""

# Deny by default at the top level; each job below opts into exactly what it
# needs. Without this, a job that forgets its own `permissions:` block inherits
# the repository default, which is how a candidate-code job quietly acquires
# write scope.
permissions: {}

# The build job runs candidate code with read-only permissions. Only the small
# publisher job receives contents:write, and it does not check out or execute
# candidate code — the floating tag is moved through the API for that reason,
# not with a git checkout.
#
# This workflow PUBLISHES. The release is a public prerelease on the floating
# `iconpack-test` tag, so one Downloader code generated once at
# go.aftvnews.com keeps resolving after every rebuild. Two consequences to
# keep in mind before changing anything here:
#
#   * every dispatch replaces what the public test channel serves, and
#   * the asset filename is load-bearing. `iconpack-test.apk` is baked into a
#     numeric code that cannot be edited afterwards, so it may never gain a
#     version or a commit sha.
#
# Debug signing only: no KEYSTORE_* value is read, and the production
# `iconpack` release is never touched.

jobs:
  build:
    name: Validate and build test variant
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.src.outputs.source_commit }}
      version: ${{ steps.src.outputs.version }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1

      - name: Record the checked-out revision
        id: src
        run: |
          # Captured here, before anything from source_ref executes. Every step
          # below runs candidate code — Gradle, its plugins, its dependencies —
          # and any of it can move HEAD or rewrite build.gradle.kts inside the
          # workspace. The publish job moves a tag with contents: write, so the
          # value it moves the tag to must come from a point no candidate code
          # has reached yet. Reading it after the build would hand the choice of
          # tag target to the thing being tested.
          COMMIT=$(git rev-parse HEAD)
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test "${#COMMIT}" -eq 40
          test -n "$VERSION"
          echo "source_commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $COMMIT at version $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install --quiet -r tools/requirements.txt

      - name: Validate source before packaging
        run: |
          python tools/check_suite_truth.py
          python tools/validate.py
          python tests/test_icon_identity.py
          python tests/test_wallpapers.py
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build test variant only
        env:
          # The resolved checkout, not github.sha — source_ref may point
          # somewhere else entirely, and the stamp baked into the APK should
          # name what was actually built.
          SOURCE_COMMIT: ${{ steps.src.outputs.source_commit }}
        run: |
          ./gradlew :app:lintCandidate :app:testCandidateUnitTest :app:assembleCandidate \
            -PtestSourceCommit="${SOURCE_COMMIT:0:7}" --no-daemon --stacktrace

      - name: Name the APK for the stable Downloader URL
        env:
          SOURCE_COMMIT: ${{ steps.src.outputs.source_commit }}
          VERSION: ${{ steps.src.outputs.version }}
        run: |
          APK=$(find app/build/outputs/apk/candidate -maxdepth 1 -type f -name '*.apk' | head -1)
          test -n "$APK"
          mkdir -p test-apk
          # One fixed name, forever. The Downloader code is generated once
          # against this URL and cannot be repointed, so a version or sha in
          # the filename would break every code the moment we rebuild.
          cp "$APK" test-apk/iconpack-test.apk
          (cd test-apk && sha256sum iconpack-test.apk > iconpack-test.apk.sha256)
          printf 'Core Builds Icon Pack TEST APK\nNot a production release.\nVersion: %s\nSource commit: %s\nPackage: tv.corebuilds.iconpack.test\n' \
            "$VERSION" "$SOURCE_COMMIT" > test-apk/BUILD-INFO.txt
          ls -lh test-apk/

      - name: Upload short-lived workflow hand-off
        uses: actions/upload-artifact@v4
        with:
          name: iconpack-test-${{ github.sha }}
          path: test-apk/
          retention-days: 1
          if-no-files-found: error

  publish-test-channel:
    name: Publish to the floating test channel
    needs: build
    runs-on: ubuntu-latest
    # One channel, one publisher at a time. Two dispatches can otherwise
    # interleave: the older run's `--clobber` upload lands after the newer run
    # has already moved the tag and written the notes, leaving the fixed URL
    # serving one APK while the published SHA-256 describes another. Queue
    # rather than cancel, so a superseded run still finishes coherently.
    concurrency:
      group: iconpack-test-channel
      cancel-in-progress: false
    # This job does not check out or execute the candidate repository contents.
    permissions:
      contents: write
    steps:
      - name: Download hand-off
        uses: actions/download-artifact@v4
        with:
          name: iconpack-test-${{ github.sha }}
          path: test-apk

      - name: Move the floating tag and publish the test channel
        env:
          GH_TOKEN: ${{ github.token }}
          # Job outputs recorded before the build ran, not values parsed back
          # out of the artifact. BUILD-INFO.txt travels with the APK as a record
          # for whoever installs it, but nothing privileged is decided from it:
          # it is written by a step that runs after candidate code.
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "${#SOURCE_COMMIT}" -eq 40
          test -n "$VERSION"
          test -f test-apk/iconpack-test.apk
          TAG=iconpack-test

          # Move (or create) the tag through the API. Doing it with `git tag -f`
          # would mean checking the candidate revision out into this
          # contents:write job, which is exactly what this split exists to avoid.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$SOURCE_COMMIT" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$SOURCE_COMMIT" >/dev/null
          fi

          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/iconpack-test.apk"
          {
            printf '**This is a test build. It is not the icon pack you want unless you were asked to try it.**\n\n'
            printf 'Package `tv.corebuilds.iconpack.test`. It installs *beside* the production pack instead of over it, and it **never auto-updates** — whatever you install here stays on this build until you sideload another or uninstall it. For the real pack use the [`iconpack`](https://github.com/%s/releases/tag/iconpack) release.\n\n' "$GITHUB_REPOSITORY"
            printf 'Built from `%s` at version %s, debug-signed. No production signing key is read by this workflow.\n\n' "$SOURCE_COMMIT" "$VERSION"
            printf 'Downloader URL — the numeric code is generated once at https://go.aftvnews.com/ and keeps resolving after every rebuild:\n\n    %s\n\n' "$URL"
            printf 'SHA-256 of this build:\n\n    %s\n' "$(cut -d' ' -f1 test-apk/iconpack-test.apk.sha256)"
          } > notes.md

          TITLE="Core Builds Icon Pack — test channel"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease --latest=false \
              --title "$TITLE" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_COMMIT" --prerelease --latest=false \
              --title "$TITLE" --notes-file notes.md
          fi
          gh release upload "$TAG" test-apk/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Test channel now serves $SOURCE_COMMIT at $URL"
