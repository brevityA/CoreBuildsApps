name: Build restricted icon pack test APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit or ref to test (defaults to the selected workflow ref)"
        required: false
        type: string
        default: ""

# The build job runs candidate code with read-only permissions. Only the small
# publisher job receives contents:write, and it does not check out or execute
# candidate code. The resulting release stays a GitHub draft and is never made
# public by this workflow.

jobs:
  build:
    name: Validate and build test variant
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install --quiet -r tools/requirements.txt

      - name: Validate source before packaging
        run: |
          python tools/check_suite_truth.py
          python tools/validate.py
          python tests/test_icon_identity.py
          python tests/test_wallpapers.py
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build test variant only
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          ./gradlew :app:lintCandidate :app:testCandidateUnitTest :app:assembleCandidate \
            -PtestSourceCommit="${SOURCE_COMMIT:0:7}" --no-daemon --stacktrace

      - name: Name APK and create checksum
        run: |
          APK=$(find app/build/outputs/apk/candidate -maxdepth 1 -type f -name '*.apk' | head -1)
          test -n "$APK"
          SOURCE_COMMIT=$(git rev-parse HEAD)
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          SHORT_SHA="${SOURCE_COMMIT:0:7}"
          mkdir -p test-apk
          OUT="test-apk/core-builds-icon-pack-${VERSION}-test-${SHORT_SHA}.apk"
          cp "$APK" "$OUT"
          (cd test-apk && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          printf 'Core Builds Icon Pack TEST APK\nNot a production release.\nSource commit: %s\nPackage: tv.corebuilds.iconpack.test\n' "$SOURCE_COMMIT" > test-apk/BUILD-INFO.txt

      - name: Upload short-lived workflow hand-off
        uses: actions/upload-artifact@v4
        with:
          name: iconpack-test-${{ github.sha }}
          path: test-apk/
          retention-days: 1
          if-no-files-found: error

  publish-draft:
    name: Attach test APK to unpublished draft
    needs: build
    runs-on: ubuntu-latest
    # This job does not check out or execute the candidate repository contents.
    permissions:
      contents: write
    steps:
      - name: Download hand-off
        uses: actions/download-artifact@v4
        with:
          name: iconpack-test-${{ github.sha }}
          path: test-apk

      - name: Create or update unpublished draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_COMMIT=$(sed -n 's/^Source commit: //p' test-apk/BUILD-INFO.txt)
          test "${#SOURCE_COMMIT}" -eq 40
          TAG="iconpack-test-${SOURCE_COMMIT:0:7}"
          TITLE="Core Builds Icon Pack test build ${SOURCE_COMMIT:0:7} (DRAFT)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TITLE" \
              --notes "Maintainer-only test build. NOT a production release. Source: $SOURCE_COMMIT"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$SOURCE_COMMIT" \
              --title "$TITLE" --notes "Maintainer-only test build. NOT a production release. Source: $SOURCE_COMMIT"
          fi
          gh release upload "$TAG" test-apk/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Uploaded only to unpublished draft release $TAG"
