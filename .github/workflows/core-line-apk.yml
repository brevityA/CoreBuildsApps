name: Core Line APK

# Builds the Core Line Android/TV app (ticker/android) and runs the shared
# parser / SSRF test suite (ticker). The Android project is standalone —
# it has its own Gradle root at ticker/android and is not part of the
# icon-pack build in app/.
#
# CI:       push/PR on ticker/** → test + debug APK artifact
# Release:  push a coreline-v* tag → test + signed release APK → GitHub Release
#
# Tag prefix is "coreline-v" (not bare "v") so it never collides with the
# icon pack's v* tags.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ticker/**'
      - '.github/workflows/core-line-apk.yml'
  push:
    branches: [main]
    tags: ['coreline-v*']
    paths:
      - 'ticker/**'
      - '.github/workflows/core-line-apk.yml'

permissions:
  contents: write

jobs:
  test:
    name: Ticker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run parser / SSRF tests
        run: cd ticker && npm test

  apk:
    name: Assemble APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to build a tag that is not on main
        if: startsWith(github.ref, 'refs/tags/coreline-v')
        run: |
          git fetch origin main --depth=50
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not an ancestor of main"; exit 1; }
          TAG="${GITHUB_REF_NAME#coreline-v}"
          GRADLE=$(grep -oP 'versionName = "\K[^"]+' ticker/android/app/build.gradle.kts)
          [ "$TAG" = "$GRADLE" ] \
            || { echo "::error::tag $TAG != versionName $GRADLE"; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Keystore decoded — release will be signed."

      - name: Assemble release APK
        if: startsWith(github.ref, 'refs/tags/coreline-v')
        working-directory: ticker/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Assemble debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/coreline-v') }}
        working-directory: ticker/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify release APK is signed
        if: startsWith(github.ref, 'refs/tags/coreline-v')
        run: |
          APK=$(ls ticker/android/app/build/outputs/apk/release/*.apk)
          echo "Verifying $APK"
          case "$APK" in
            *-unsigned.apk)
              echo "::error::$APK is unsigned — a tagged release must be installable."
              exit 1
              ;;
          esac
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          echo "APK signature verified."

      - name: Name the APK for the stable Downloader URL
        if: startsWith(github.ref, 'refs/tags/coreline-v')
        run: |
          SRC=$(ls ticker/android/app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          mkdir -p dist
          cp "$SRC" dist/coreline-release.apk
          ls -lh dist/coreline-release.apk
          echo "CORELINE_APK=$PWD/dist/coreline-release.apk" >> "$GITHUB_ENV"

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/coreline-v') }}
        uses: actions/upload-artifact@v7
        with:
          name: CoreLine-debug
          path: ticker/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        if: startsWith(github.ref, 'refs/tags/coreline-v')
        uses: actions/upload-artifact@v7
        with:
          name: CoreLine-release
          path: dist/coreline-release.apk
          if-no-files-found: error

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/coreline-v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/coreline-release.apk
          generate_release_notes: true
          name: "Core Line ${{ github.ref_name }}"
          make_latest: false

      - name: Point floating tag coreline at this commit
        if: startsWith(github.ref, 'refs/tags/coreline-v')
        run: |
          git tag -f coreline "$GITHUB_SHA"
          git push -f origin refs/tags/coreline

      - name: Publish stable Downloader release
        if: startsWith(github.ref, 'refs/tags/coreline-v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: coreline
          name: Core Line (latest)
          body: |
            Always the current Core Line APK. Versioned notes live on `coreline-v*` releases.

            Downloader (generate the numeric code **once** at https://go.aftvnews.com/):
            https://github.com/brevityA/CoreBuildsApps/releases/download/coreline/coreline-release.apk
          files: dist/coreline-release.apk
          fail_on_unmatched_files: true
          make_latest: false
