name: Build Google Play bundles

# The Google Play apps, kept apart from the sideload release in build.yml:
# Core Builds Icon Pack (tv.corebuilds.iconpack.play) and Core Builds Glyphs
# (tv.corebuilds.iconpack.glyphs.play), as App Bundles signed with the Play
# upload key (PLAY_KEYSTORE_*), never the sideload release key. Play App
# Signing re-signs what users install. This workflow publishes nothing: it
# uploads the two .aab files as an artifact for Play Console.
#
# Run it by hand (Actions -> Build Google Play bundles -> Run workflow) from
# main after the sideload release is tagged. No tag trigger: a tag prefix is a
# release contract owned by suite.json, and a Play build cuts no release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundles:
    runs-on: ubuntu-latest
    # Job level, not step level: a step's `if:` cannot see its own `env:` and
    # cannot see `secrets` at all (see the note in build.yml).
    env:
      PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to build anything but main
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] \
            || { echo "::error::Play bundles are built from main only, not $GITHUB_REF"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Play policy gates
        run: |
          python tests/test_play_build.py
          python tests/test_glyphs_pack.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Play upload keystore
        if: env.PLAY_KEYSTORE_BASE64 != ''
        run: |
          echo "$PLAY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/play-upload.jks"
          echo "PLAY_KEYSTORE_PATH=$RUNNER_TEMP/play-upload.jks" >> "$GITHUB_ENV"
          echo "Play upload keystore decoded - bundles will be signed."

      - name: Build Play bundles
        env:
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: ./gradlew :app:lintPlay :glyphs:lintPlay :app:bundlePlay :glyphs:bundlePlay --no-daemon

      - name: Verify the bundles are signed
        # Play Console rejects an unsigned upload. With the upload key set,
        # an unsigned bundle is a broken key; without it, say so plainly.
        run: |
          for AAB in app/build/outputs/bundle/play/*.aab glyphs/build/outputs/bundle/play/*.aab; do
            if jarsigner -verify "$AAB" | grep -q "jar verified"; then
              echo "$AAB signed."
            elif [ -n "$PLAY_KEYSTORE_BASE64" ]; then
              echo "::error::$AAB is unsigned although PLAY_KEYSTORE_BASE64 is set. Check PLAY_KEYSTORE_PASSWORD, PLAY_KEY_ALIAS, PLAY_KEY_PASSWORD."
              exit 1
            else
              echo "::warning::$AAB is unsigned: PLAY_KEYSTORE_BASE64 is not set, and Play Console will not accept it."
            fi
          done

      - name: Upload Play bundles
        uses: actions/upload-artifact@v7
        with:
          name: core-builds-play-bundles
          path: |
            app/build/outputs/bundle/play/*.aab
            glyphs/build/outputs/bundle/play/*.aab
          if-no-files-found: error
