name: Core Builds Launcher prototype CI

# Build/lint guard only. This private prototype has no tag, release, store, or
# public APK distribution lane.
on:
  pull_request:
    paths:
      - 'launcher/**'
      - 'docs/CORE_LAUNCHER_PROTOTYPE_RESEARCH.md'
      - '.github/workflows/core-launcher-prototype-ci.yml'
      - 'tools/gradle_envelope.json'
      - 'tools/check_gradle_envelope.py'
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'docs/CORE_LAUNCHER_PROTOTYPE_RESEARCH.md'
      - '.github/workflows/core-launcher-prototype-ci.yml'
      - 'tools/gradle_envelope.json'
      - 'tools/check_gradle_envelope.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-prototype:
    name: Build and lint private launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 37
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0" \
            || bash tools/install_android_platform.sh 37.0 36.0.0

      - uses: gradle/actions/setup-gradle@v6

      - id: build
        name: Build and lint debug APK (no release artifact)
        working-directory: launcher
        run: ./gradlew :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      # Keep the cause visible in check annotations as well as the job log.
      # This private-launcher job is a required merge gate, and the signed log
      # download is not always available to reviewers through the PR UI.
      - name: Surface Gradle failure details
        if: failure() && steps.build.outcome == 'failure'
        working-directory: launcher
        shell: bash
        run: |
          ./gradlew :app:lintDebug :app:assembleDebug --no-daemon --stacktrace --console=plain > build_out.txt 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path("build_out.txt").read_text(errors="replace").splitlines()
          selected = []
          capture_cause = 0
          marker = re.compile(
              r"^(?:e: |w: |FAILURE: |\* What went wrong:|Execution failed for task |"
              r"> Task .* FAILED|BUILD FAILED|.*\.kt:\d+(?::\d+)?: error:|"
              r".*: error: .+|.*: Error: .+)"
          )
          for line in lines:
              stripped = line.strip()
              if marker.search(stripped):
                  if stripped not in selected:
                      selected.append(stripped)
                  capture_cause = 8 if (
                      "What went wrong:" in stripped
                      or stripped.startswith("Execution failed for task ")
                  ) else 0
              elif capture_cause and stripped.startswith("> "):
                  if stripped not in selected:
                      selected.append(stripped)
                  capture_cause -= 1
              elif capture_cause and not stripped:
                  capture_cause -= 1

          if not selected:
              selected = [line.strip() for line in lines
                          if re.search(r"FAILED|error|exception|BUILD FAILED", line, re.I)][-12:]
          if not selected:
              selected = ["Gradle failed; inspect the full job log for details."]
          for line in selected[:16]:
              escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Gradle diagnostic::{escaped}")
          PY
