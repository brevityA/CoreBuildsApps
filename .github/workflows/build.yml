name: Build icon pack

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2
          pip install --quiet cairosvg

      - name: Regenerate assets from catalog
        run: |
          python tools/build_icons.py
          python tools/build_branding.py
          python tools/build_brand_preview.py

      - name: Verify committed assets match the catalog
        # The repo must never drift from its own generator.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated assets differ from committed ones."
            echo "Run: python tools/build_icons.py && python tools/build_branding.py"
            git --no-pager diff --stat
            exit 1
          fi
          echo "Assets verified in sync with tools/catalog.json"

      - name: Validate catalog + appfilter
        run: python tools/validate.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-builds-icon-pack
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
