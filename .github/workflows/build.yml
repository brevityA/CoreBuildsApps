name: Build icon pack

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'tools/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'Latestrelease/**'
      - 'Wallpapers/**'
      - 'tests/**'
      # This job's gates read all three app modules: check_ui_resources and
      # test_navigation_graph walk app/, pop/ and pixel-neon/ resources, and
      # build_app_ui_mockups --check compares the frames committed under docs/.
      # Without these three a fork-only change - a dead button in Pixel Neon, a
      # stale mockup - reached main without running any of them.
      - 'pop/**'
      - 'banners/**'
      - 'pixel-neon/**'
      - 'docs/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'Latestrelease/**'
      - 'Wallpapers/**'
      - 'tests/**'
      - 'pop/**'
      - 'banners/**'
      - 'pixel-neon/**'
      - 'docs/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Promoted to job level on purpose. A step's own `env:` block is not visible
    # to that step's `if:` — the env context there carries workflow- and
    # job-level variables only. Testing `env.KEYSTORE_BASE64` from inside the
    # step that defines it always read empty, so the decode step never ran and
    # every release APK came out unsigned, including on tags. The secrets
    # context is not available in `if:` at all, so job-level env is the fix.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Check suite truth
        run: python tools/check_suite_truth.py

      - name: Refuse to build a tag that is not on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main --depth=50
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not an ancestor of main"; exit 1; }
          TAG="${GITHUB_REF_NAME#v}"
          GRADLE=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          [ "$TAG" = "$GRADLE" ] \
            || { echo "::error::tag $TAG != versionName $GRADLE"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install render deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2
          pip install --quiet -r tools/requirements.txt

      # Before the regeneration below, on purpose. The check compares the
      # committed frames against the sources they were generated from, and
      # those sources include the rasters the frames paste - real icons out of
      # res/drawable-nodpi and real thumbs out of assets/wallpapers_thumbs.
      # PNG bytes move with the runner's rasteriser stack, which is why the
      # drift gate below is scoped to text assets and only *notices* PNG
      # changes; run after a regeneration, this check would be comparing
      # against rasters this runner just re-encoded. Run against the committed
      # tree, it answers the question it is asked: do the frames in docs/
      # depict the layouts, strings and dimens in the repo?
      - name: Check the committed UI frames depict the source
        run: python tools/build_app_ui_mockups.py --check

      - name: Regenerate assets from catalog
        run: |
          python tools/build_icons.py
          python tools/build_banners.py
          python tools/build_banners_pack.py
          python tools/build_branding.py
          python tools/build_brand_preview.py
          python tools/build_icon_review.py

      - name: Verify committed assets match the catalog
        # The repo must never disagree with its own generator.
        #
        # Scoped to text assets (XML, SVG, MD) on purpose: PNG bytes vary with
        # the runner's libcairo build, so diffing them would fail on a library
        # bump rather than on real drift. The XML mapping is what correctness
        # actually depends on — a stale PNG is cosmetic, a stale appfilter is a
        # broken pack.
        run: |
          DRIFT=$(git status --porcelain -- '*.xml' '*.svg' '*.md' | grep -v '^?? ' || true)
          if [ -n "$DRIFT" ]; then
            echo "::error::Generated files differ from committed ones."
            echo "Run: python tools/build_icons.py && python tools/build_banners.py && python tools/build_branding.py && python tools/build_brand_preview.py"
            echo "$DRIFT"
            git --no-pager diff -- '*.xml' '*.svg' '*.md'
            exit 1
          fi
          echo "Text assets verified in sync with tools/catalog.json"
          if [ -n "$(git status --porcelain -- '*.png')" ]; then
            echo "::notice::PNGs re-rendered with different bytes (libcairo version drift, not content drift)."
          fi

      - name: Validate catalog + appfilter
        run: python tools/validate.py

      - name: Check every UI resource the three modules reference
        run: python tools/check_ui_resources.py

      - name: Run robustness + wallpapers tests
        run: |
          python tests/test_icon_identity.py
          python tests/test_v151_robustness.py
          python tests/test_wallpapers.py
          python tests/test_wallpaper_export.py
          python tests/test_resource_parity.py
          python tests/test_tv_layout_fit.py
          python tests/test_search_focus.py
          python tests/test_icon_uniformity.py
          python tests/test_ui_wiring.py
          python tests/test_brandmark_badge.py
          python tests/test_navigation_graph.py
          python tests/test_tv_scale.py
          python tests/test_mapping_hygiene.py
          python tests/test_monet_handoff.py
          python tests/test_render_stack.py
          python tests/test_ci_coverage.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Keystore decoded — release will be signed."

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify the APK is signed before releasing
        # An unsigned APK cannot be installed on Android at all, so publishing
        # one to a tag ships an artifact nobody can use. The signing config was
        # silently skipped for every build before this workflow was fixed; this
        # step is the check that would have caught it, rather than trusting the
        # config to be wired correctly.
        #
        # Tags only: untagged runs are allowed to produce an unsigned APK, which
        # is what PUBLISHING.md documents for contributors without the keystore.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          echo "Verifying $APK"
          case "$APK" in
            *-unsigned.apk)
              echo "::error::$APK is unsigned — a tagged release must be installable."
              echo "KEYSTORE_BASE64 is unset or failed to decode. See PUBLISHING.md step 4."
              exit 1
              ;;
          esac
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          echo "APK signature verified."
          # Core Builds Banners ships in the same release and the icon pack
          # installs it only if its certificate matches its own, so an
          # unsigned or differently signed companion is a broken toggle.
          BANNERS=$(ls banners/build/outputs/apk/release/*.apk)
          case "$BANNERS" in
            *-unsigned.apk)
              echo "::error::$BANNERS is unsigned."
              exit 1
              ;;
          esac
          A=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | grep 'SHA-256 digest')
          B=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$BANNERS" | grep 'SHA-256 digest')
          if [ "$A" != "$B" ]; then
            echo "::error::Core Builds Banners is not signed with the icon pack's certificate."
            exit 1
          fi
          echo "Companion signed with the same certificate."

      - name: Name the APK for the stable Downloader URL
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SRC=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          mkdir -p dist
          cp "$SRC" dist/iconpack-release.apk
          # Compatibility filename requested by existing Downloader code 5270601.
          cp "$SRC" dist/app-release.apk
          # The 16:9 companion. The icon pack downloads exactly this name from
          # the v<versionName> release (BannersCompanion.apkUrl), so the name is
          # a contract: tests/test_banners_pack.py holds the two together.
          cp "$(ls banners/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)" \
            dist/iconpack-banners-release.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: core-builds-icon-pack
          path: |
            app/build/outputs/apk/release/*.apk
            banners/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Sync the update manifest to the published tag
        # Latestrelease/version.json is what the in-app updater polls. If it
        # is not bumped on release, every user is told they are current when
        # they are not. Commit it back to main as part of publishing rather
        # than relying on remembering.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          python - "$TAG" <<'PY'
          import json, re, sys
          tag = sys.argv[1]
          gradle = open('app/build.gradle.kts').read()
          code = int(re.search(r'versionCode\s*=\s*(\d+)', gradle).group(1))
          p = 'Latestrelease/version.json'
          d = json.load(open(p))
          d['versionCode'] = code
          d['versionName'] = tag
          json.dump(d, open(p, 'w'), indent=2)
          open(p, 'a').write('\n')
          print(f'version.json -> {tag} / {code}')
          PY
          if ! git diff --quiet -- Latestrelease/version.json; then
            cp Latestrelease/version.json /tmp/version.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git fetch origin main --depth=50
            git checkout -B _version-sync origin/main
            cp /tmp/version.json Latestrelease/version.json
            git add Latestrelease/version.json
            git commit -m "chore: sync update manifest to ${GITHUB_REF_NAME}"
            git push origin _version-sync:main
          fi

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Immutable releases (repo setting): a published release's assets
          # cannot be modified, so assets must be attached while the release
          # is still a draft, then the release published. softprops'
          # publish-then-partially-patch flow lost its assets silently on
          # v1.9.2's first run. delete-if-exists also makes a rerun after a
          # partial publish self-healing instead of 'already exists'.
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --draft --generate-notes --verify-tag \
            dist/iconpack-release.apk dist/app-release.apk \
            dist/iconpack-banners-release.apk
          gh release edit "$TAG" --draft=false --latest

      - name: Point floating tag iconpack at this commit
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git tag -f iconpack "$GITHUB_SHA"
          git push -f origin refs/tags/iconpack

      - name: Publish stable Downloader release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The floating release cannot be edited once published (immutable
          # releases), so it is deleted and recreated atomically on every
          # tag. The public URL stays stable: it is tag-based, not id-based.
          gh release delete iconpack --yes 2>/dev/null || true
          gh release create iconpack --draft \
            --title "Icon Pack (latest)" \
            --notes "$(cat <<'EOF'
          Always the current Core Builds Icon Pack APK. Versioned notes live on `v*` releases.

          Downloader (existing code **5270601** still uses latest/app-release.apk).
          New stable URL (generate a code once at https://go.aftvnews.com/ if you want a second code):
          https://github.com/brevityA/CoreBuildsApps/releases/download/iconpack/iconpack-release.apk
          EOF
          )" \
            dist/iconpack-release.apk dist/app-release.apk \
            dist/iconpack-banners-release.apk
          gh release edit iconpack --draft=false --latest=false
