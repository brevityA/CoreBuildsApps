name: Build icon pack

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'tools/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'Latestrelease/**'
      - 'Wallpapers/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'Latestrelease/**'
      - 'Wallpapers/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Promoted to job level on purpose. A step's own `env:` block is not visible
    # to that step's `if:` — the env context there carries workflow- and
    # job-level variables only. Testing `env.KEYSTORE_BASE64` from inside the
    # step that defines it always read empty, so the decode step never ran and
    # every release APK came out unsigned, including on tags. The secrets
    # context is not available in `if:` at all, so job-level env is the fix.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to build a tag that is not on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main --depth=50
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not an ancestor of main"; exit 1; }
          TAG="${GITHUB_REF_NAME#v}"
          GRADLE=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          [ "$TAG" = "$GRADLE" ] \
            || { echo "::error::tag $TAG != versionName $GRADLE"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install render deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2
          pip install --quiet -r tools/requirements.txt

      - name: Regenerate assets from catalog
        run: |
          python tools/build_icons.py
          python tools/build_banners.py
          python tools/build_branding.py
          python tools/build_brand_preview.py

      - name: Verify committed assets match the catalog
        # The repo must never disagree with its own generator.
        #
        # Scoped to text assets (XML, SVG, MD) on purpose: PNG bytes vary with
        # the runner's libcairo build, so diffing them would fail on a library
        # bump rather than on real drift. The XML mapping is what correctness
        # actually depends on — a stale PNG is cosmetic, a stale appfilter is a
        # broken pack.
        run: |
          DRIFT=$(git status --porcelain -- '*.xml' '*.svg' '*.md' | grep -v '^?? ' || true)
          if [ -n "$DRIFT" ]; then
            echo "::error::Generated files differ from committed ones."
            echo "Run: python tools/build_icons.py && python tools/build_banners.py && python tools/build_branding.py && python tools/build_brand_preview.py"
            echo "$DRIFT"
            git --no-pager diff -- '*.xml' '*.svg' '*.md'
            exit 1
          fi
          echo "Text assets verified in sync with tools/catalog.json"
          if [ -n "$(git status --porcelain -- '*.png')" ]; then
            echo "::notice::PNGs re-rendered with different bytes (libcairo version drift, not content drift)."
          fi

      - name: Validate catalog + appfilter
        run: python tools/validate.py

      - name: Run robustness + wallpapers tests
        run: |
          python tests/test_v151_robustness.py
          python tests/test_wallpapers.py
          python tests/test_wallpaper_export.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Keystore decoded — release will be signed."

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify the APK is signed before releasing
        # An unsigned APK cannot be installed on Android at all, so publishing
        # one to a tag ships an artifact nobody can use. The signing config was
        # silently skipped for every build before this workflow was fixed; this
        # step is the check that would have caught it, rather than trusting the
        # config to be wired correctly.
        #
        # Tags only: untagged runs are allowed to produce an unsigned APK, which
        # is what PUBLISHING.md documents for contributors without the keystore.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          echo "Verifying $APK"
          case "$APK" in
            *-unsigned.apk)
              echo "::error::$APK is unsigned — a tagged release must be installable."
              echo "KEYSTORE_BASE64 is unset or failed to decode. See PUBLISHING.md step 4."
              exit 1
              ;;
          esac
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          echo "APK signature verified."

      - name: Name the APK for the stable Downloader URL
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SRC=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          mkdir -p dist
          cp "$SRC" dist/iconpack-release.apk
          # Compatibility filename requested by existing Downloader code 5270601.
          cp "$SRC" dist/app-release.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: core-builds-icon-pack
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Sync the update manifest to the published tag
        # Latestrelease/version.json is what the in-app updater polls. If it
        # is not bumped on release, every user is told they are current when
        # they are not. Commit it back to main as part of publishing rather
        # than relying on remembering.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          python - "$TAG" <<'PY'
          import json, re, sys
          tag = sys.argv[1]
          gradle = open('app/build.gradle.kts').read()
          code = int(re.search(r'versionCode\s*=\s*(\d+)', gradle).group(1))
          p = 'Latestrelease/version.json'
          d = json.load(open(p))
          d['versionCode'] = code
          d['versionName'] = tag
          json.dump(d, open(p, 'w'), indent=2)
          open(p, 'a').write('\n')
          print(f'version.json -> {tag} / {code}')
          PY
          if ! git diff --quiet -- Latestrelease/version.json; then
            cp Latestrelease/version.json /tmp/version.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git fetch origin main --depth=50
            git checkout -B _version-sync origin/main
            cp /tmp/version.json Latestrelease/version.json
            git add Latestrelease/version.json
            git commit -m "chore: sync update manifest to ${GITHUB_REF_NAME}"
            git push origin _version-sync:main
          fi

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/iconpack-release.apk
            dist/app-release.apk
          generate_release_notes: true
          make_latest: true

      - name: Point floating tag iconpack at this commit
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git tag -f iconpack "$GITHUB_SHA"
          git push -f origin refs/tags/iconpack

      - name: Publish stable Downloader release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: iconpack
          name: Icon Pack (latest)
          body: |
            Always the current Core Builds Icon Pack APK. Versioned notes live on `v*` releases.

            Downloader (existing code **5270601** still uses latest/app-release.apk).
            New stable URL (generate a code once at https://go.aftvnews.com/ if you want a second code):
            https://github.com/brevityA/CoreBuildsApps/releases/download/iconpack/iconpack-release.apk
          files: |
            dist/iconpack-release.apk
            dist/app-release.apk
          fail_on_unmatched_files: true
          make_latest: false
