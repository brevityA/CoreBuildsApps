name: Core EQ APK

# Builds the Core EQ application (coreeq/). Standalone Gradle root.
#
# CI:       push/PR on coreeq/** or workflow -> unit tests + debug APK artifact
# Release:  push a coreeq-v* tag -> release APK -> GitHub Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'coreeq/**'
      - '.github/workflows/core-eq-apk.yml'
  push:
    branches: [main]
    tags: ['coreeq-v*']

permissions:
  contents: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        working-directory: coreeq
        run: ./gradlew :app:test --no-daemon --stacktrace

  apk:
    name: Assemble APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        working-directory: coreeq
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: CoreEQ-debug
          path: coreeq/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
