name: Core EQ APK

# Builds the standalone Core EQ app.
#
# CI:       PRs run unit tests, lint, build, then install the debug APK and a
#           release-shape APK (production package, runner's debug key) on
#           Android 11 (API 30) and Android 17 (API 37) emulators.
# Test:     pushes to main publish a debug-package APK signed by the stable
#           production certificate, so test builds can update in place.
# Release:  coreeq-v* tags build the production package with that same
#           certificate. A certificate comparison and emulator installs must
#           pass before any release or floating tag is moved.

on:
  workflow_dispatch:
  # The two tools/ scripts below run inside this workflow's jobs, so a change
  # to either has to run it: the emulator install script went untested until
  # a tag run when only coreeq/** and this file were listed.
  pull_request:
    paths:
      - 'coreeq/**'
      - '.github/workflows/core-eq-apk.yml'
      - 'tools/install_core_eq_on_emulator.sh'
      - 'tools/install_android_platform.sh'
  push:
    branches: [main]
    paths:
      - 'coreeq/**'
      - '.github/workflows/core-eq-apk.yml'
      - 'tools/install_core_eq_on_emulator.sh'
      - 'tools/install_android_platform.sh'
    tags: ['coreeq-v*']

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check suite truth
        run: python tools/check_suite_truth.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Runs before the install so the ids this runner can actually see are in
      # the run's annotations even if everything after it fails.
      - name: Report the SDK packages this runner offers
        run: bash tools/install_android_platform.sh --report 37

      # The literal below is the job's own statement of what it compiles
      # against — tools/check_gradle_envelope.py reads `android-37` out of it
      # and holds it to Core EQ's compileSdk 37. API 37 carries a minor
      # version, so the platform package is platforms;android-37.0 and there is
      # no plain platforms;android-37 to ask for. The fallback covers the rest:
      # 37.1/37.2, and the CinnamonBun preview codename on the canary channel.
      # See tools/install_android_platform.sh; Gradle still owns the real
      # failure if no platform id resolves.
      - name: Install Android platform 37
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" || bash tools/install_android_platform.sh 37 36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and lint
        working-directory: coreeq
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/coreeq-gradle.log"

      - name: Summarize unit-test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          failures = []
          for path in Path("coreeq/app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  for node in list(case.findall("failure")) + list(case.findall("error")):
                      detail = " ".join(filter(None, [node.get("message", ""), node.text or ""]))
                      failures.append(f"{case.get('classname', '?')}#{case.get('name', '?')}: {detail[:2400]}")

          gradle_log = Path(os.environ["RUNNER_TEMP"]) / "coreeq-gradle.log"
          if not failures and gradle_log.is_file():
              lines = gradle_log.read_text(errors="replace").splitlines()
              needles = ("e: ", "error:", "What went wrong:", "Execution failed for task", "BUILD FAILED")
              failures = [line.strip() for line in lines if any(n in line for n in needles)][-20:]
              if not failures:
                  failures = lines[-25:]

          if not failures:
              failures = ["Gradle failed before producing a test report; inspect the full job log."]
          summary = "\n".join(f"- {item}" for item in failures)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("## Core EQ test failure details\n\n" + summary + "\n")
          for item in failures:
              escaped = item.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Core EQ unit-test failure::{escaped}")
          PY

  apk:
    name: Assemble candidate APK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to build a tag that is not on main
        if: startsWith(github.ref, 'refs/tags/coreeq-v')
        run: |
          git fetch origin main --depth=50
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not an ancestor of main"; exit 1; }
          TAG="${GITHUB_REF_NAME#coreeq-v}"
          GRADLE=$(grep -oP 'versionName = "\K[^"]+' coreeq/app/build.gradle.kts)
          [ "$TAG" = "$GRADLE" ] \
            || { echo "::error::tag $TAG != versionName $GRADLE"; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Same literal-id-first install as the test job, with the minor-version
      # and CinnamonBun preview fallbacks in tools/install_android_platform.sh.
      - name: Install Android platform 37
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" || bash tools/install_android_platform.sh 37 36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The release key is used only on main pushes (public test lane) and
      # version tags. Pull requests never receive or decode it.
      - name: Require signing secrets and decode release keystore
        if: startsWith(github.ref, 'refs/tags/coreeq-v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required signing secret $name is unavailable; refusing to publish an unsigned or differently signed Core EQ APK."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/coreeq-release.jks"
          test -s "$RUNNER_TEMP/coreeq-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/coreeq-release.jks" >> "$GITHUB_ENV"
          echo "Release certificate loaded for this trusted main/tag build."

      - name: Assemble release APK
        if: startsWith(github.ref, 'refs/tags/coreeq-v')
        working-directory: coreeq
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release APK is signed
        if: startsWith(github.ref, 'refs/tags/coreeq-v')
        run: |
          set -euo pipefail
          APK=$(find coreeq/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*-unsigned.apk' -print -quit)
          test -n "$APK" || { echo "::error::No signed release APK was produced."; exit 1; }
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          [[ -x "$APKSIGNER" ]] || APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          test -x "$APKSIGNER" || { echo "::error::No apksigner under $ANDROID_HOME/build-tools."; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Assemble debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/coreeq-v') }}
        working-directory: coreeq
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Fail closed if the repository key has drifted. This runs for both
      # production releases and the public test lane, against the APK users
      # currently install from the floating stable release.
      - name: Verify candidate certificate matches current stable APK
        if: startsWith(github.ref, 'refs/tags/coreeq-v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PREVIOUS_DIR="$RUNNER_TEMP/coreeq-previous"
          mkdir -p "$PREVIOUS_DIR"
          gh release download coreeq --repo "$GITHUB_REPOSITORY" \
            --pattern coreeq-release.apk --dir "$PREVIOUS_DIR"
          PREVIOUS_APK="$PREVIOUS_DIR/coreeq-release.apk"
          if [[ "$GITHUB_REF" == refs/tags/coreeq-v* ]]; then
            CANDIDATE_APK=$(find coreeq/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*-unsigned.apk' -print -quit)
          else
            CANDIDATE_APK=$(find coreeq/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          fi
          test -s "$PREVIOUS_APK" && test -s "$CANDIDATE_APK"
          # build-tools package ids move; the binary has to exist either way.
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          [[ -x "$APKSIGNER" ]] || APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          test -x "$APKSIGNER" || { echo "::error::No apksigner under $ANDROID_HOME/build-tools."; exit 1; }
          cert_sha256() {
            "$APKSIGNER" verify --print-certs "$1" \
              | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print $2; exit }' \
              | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]'
          }
          PREVIOUS_CERT=$(cert_sha256 "$PREVIOUS_APK")
          CANDIDATE_CERT=$(cert_sha256 "$CANDIDATE_APK")
          if [[ -z "$PREVIOUS_CERT" || -z "$CANDIDATE_CERT" ]]; then
            echo "::error::Could not read a signing certificate digest from both APKs."
            exit 1
          fi
          if [[ "$PREVIOUS_CERT" != "$CANDIDATE_CERT" ]]; then
            echo "::error::Core EQ signing certificate differs from the currently published APK; refusing to publish an APK users cannot install over it."
            exit 1
          fi
          echo "Candidate and current stable APK use the same signing certificate."

      - name: Name the release APK
        if: startsWith(github.ref, 'refs/tags/coreeq-v')
        run: |
          SRC=$(find coreeq/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*-unsigned.apk' -print -quit)
          test -n "$SRC"
          mkdir -p dist
          cp "$SRC" dist/coreeq-release.apk
          ls -lh dist/coreeq-release.apk

      - name: Name the debug test APK
        if: ${{ !startsWith(github.ref, 'refs/tags/coreeq-v') }}
        run: |
          APK=$(find coreeq/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/coreeq-debug.apk
          (cd dist && sha256sum coreeq-debug.apk > coreeq-debug.apk.sha256)
          ls -lh dist/

      # Until coreeq-v1.3.0 the production package met an emulator only on a
      # tag run, so the tag was the first build to find that its release APK
      # lost the 37.0 preview's package service mid-install, twice, while the
      # debug APK of the same commit installed. Pull requests now build the
      # release variant too and sign it with the runner's debug key (they never
      # receive the release key), and the install job installs both.
      - name: Assemble release-shape APK (debug key)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          (cd coreeq && ./gradlew :app:assembleRelease --no-daemon --stacktrace)
          UNSIGNED=$(find coreeq/app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)
          test -n "$UNSIGNED" || { echo "::error::No unsigned release APK was produced."; exit 1; }
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          [[ -x "$BUILD_TOOLS/apksigner" ]] || BUILD_TOOLS="$(dirname "$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1)")"
          test -x "$BUILD_TOOLS/apksigner" && test -x "$BUILD_TOOLS/zipalign" \
            || { echo "::error::No apksigner/zipalign under $ANDROID_HOME/build-tools."; exit 1; }
          # assembleDebug above created the runner's debug keystore.
          KS="$HOME/.android/debug.keystore"
          test -s "$KS" || { echo "::error::No debug keystore at $KS after assembleDebug."; exit 1; }
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/coreeq-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KS" --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android --v4-signing-enabled false \
            --out dist/coreeq-release-debugkey.apk "$RUNNER_TEMP/coreeq-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify dist/coreeq-release-debugkey.apk
          ls -lh dist/

      - name: Upload candidate APK
        uses: actions/upload-artifact@v7
        with:
          name: CoreEQ-${{ startsWith(github.ref, 'refs/tags/coreeq-v') && 'release' || 'debug' }}
          path: dist/*
          if-no-files-found: error

  install:
    name: Install on Android API ${{ matrix.api-level }}
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          # API 37 carries a minor version: the emulator runner asks
          # sdkmanager for platforms;android-<api-level> and
          # system-images;android-<api-level>;..., so the level it is given has
          # to be the full id (37.0). Its packages are on the canary channel.
          - api-level: '30'
            channel: stable
            emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # The 37.0 preview image boots far slower than a stable one under
          # swiftshader; give it the machine's cores and more RAM, and the boot
          # wait below the time it needs rather than the 600 s default.
          #
          # Its data partition also comes up too small to hold even the 4 MB
          # debug APK, and `disk-size` alone (disk.dataPartition.size in
          # config.ini) did not change that: `adb install` failed with
          # "remote write failed: No space left on device" and the streaming
          # and stdin forms with "Requested internal only, but not enough
          # space". -partition-size is the emulator's own command-line override
          # for the system and data partitions, so this leg passes it too.
          - api-level: '37.0'
            channel: canary
            cores: 4
            ram-size: 4096M
            disk-size: 8192M
            emulator-options: >-
              -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
              -no-boot-anim -partition-size 8192
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: CoreEQ-${{ startsWith(github.ref, 'refs/tags/coreeq-v') && 'release' || 'debug' }}
          path: dist

      # The emulator runner installs the platform without a channel flag, so
      # the canary-channel packages are installed here first; a package that is
      # already installed is a no-op for its own install. This is also where a
      # wrong system-image id shows up as an annotation instead of only in a
      # log nobody can download.
      - name: Preinstall the preview-channel platform and system image
        if: matrix.channel == 'canary'
        run: bash tools/install_android_platform.sh "${{ matrix.api-level }}" 36.0.0 --system-image google_apis x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and install APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          channel: ${{ matrix.channel }}
          cores: ${{ matrix.cores || 2 }}
          ram-size: ${{ matrix.ram-size || '2048M' }}
          emulator-boot-timeout: 1800
          disable-animations: true
          emulator-options: ${{ matrix.emulator-options }}
          # One line on purpose: the action runs each line of `script:` as its
          # own `sh -c`, so state has to live in the script it calls. The whole
          # check lives in tools/install_core_eq_on_emulator.sh.
          script: bash tools/install_core_eq_on_emulator.sh

  publish:
    name: Publish verified APK
    needs: [apk, install]
    if: startsWith(github.ref, 'refs/tags/coreeq-v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download verified artifact
        uses: actions/download-artifact@v7
        with:
          name: CoreEQ-${{ startsWith(github.ref, 'refs/tags/coreeq-v') && 'release' || 'debug' }}
          path: dist

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/coreeq-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --draft --generate-notes --verify-tag \
            dist/coreeq-release.apk
          # The M6a caveat is appended to the generated notes rather than
          # remembered in prose: this release ships the DynamicsProcessing
          # engine with no real-TV limiter evidence yet, and the release page
          # is where that has to be visible.
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/coreeq-notes.md"
          {
            echo
            echo "**Acceptance gate:** M6a — real-TV DynamicsProcessing engagement and limiter-clamp evidence — is not yet recorded on hardware. This release ships with M6a outstanding; see \`docs/CORE_EQ_M6A_TEST_RUNBOOK.md\`."
          } >> "$RUNNER_TEMP/coreeq-notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/coreeq-notes.md" --draft=false --latest=false

      - name: Point floating tag coreeq at this commit
        if: startsWith(github.ref, 'refs/tags/coreeq-v')
        run: |
          git tag -f coreeq "$GITHUB_SHA"
          git push -f origin refs/tags/coreeq

      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/coreeq-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete coreeq --yes 2>/dev/null || true
          gh release create coreeq --draft \
            --title "Core EQ (latest)" \
            --notes "Always the current Core EQ APK. Versioned notes live on coreeq-v* releases. Stable URL: https://github.com/brevityA/CoreBuildsApps/releases/download/coreeq/coreeq-release.apk" \
            dist/coreeq-release.apk
          gh release edit coreeq --draft=false --latest=false

      - name: Publish to the coreeq-test prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="coreeq-test"
          REPO="$GITHUB_REPOSITORY"
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
          VERSION=$(grep -oP 'versionName = "\K[^"]+' coreeq/app/build.gradle.kts)
          TITLE="Core EQ — test channel (tv.corebuilds.eq)"
          NOTES="Debug build of Core EQ $VERSION signed with the production certificate; installs beside the release app as tv.corebuilds.eq.debug. Changes: coreeq/CHANGELOG.md."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" \
              --draft=false --prerelease --latest=false \
              --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$REPO" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload "$TAG" dist/coreeq-debug.apk dist/coreeq-debug.apk.sha256 --repo "$REPO" --clobber

      # Last on purpose, and never on a PR or an agent branch: the feed is what
      # every installed copy polls, so it may only name a build whose APK is
      # already downloadable. Publishing it after the releases above is the
      # same ordering the icon pack's tag build uses (tests/test_update_manifest_gate.py
      # holds that half there; tests/test_core_eq_update_contract.py holds it here).
      - name: Publish the updater manifest
        if: startsWith(github.ref, 'refs/tags/coreeq-v')
        run: |
          set -euo pipefail
          python tools/generate_release_metadata.py coreeq \
            --apk dist/coreeq-release.apk --out "$RUNNER_TEMP/coreeq-version.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=50
          git checkout -B _coreeq-update-manifest origin/main
          cp "$RUNNER_TEMP/coreeq-version.json" Latestrelease/coreeq-version.json
          python tools/audit_contract.py
          if ! git diff --quiet -- Latestrelease/coreeq-version.json; then
            git add Latestrelease/coreeq-version.json
            git commit -m "chore: publish Core EQ ${GITHUB_REF_NAME#coreeq-v} updater manifest"
            git push origin _coreeq-update-manifest:main
          fi
