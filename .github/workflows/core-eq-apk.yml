name: Core EQ APK

# Builds the Core EQ room equaliser (coreeq/). Standalone Gradle root — not
# part of the icon-pack, Core Line, Core Shift, Core Motion or Core Doctor
# builds.
#
# CI:        PRs on coreeq/** → unit tests + debug APK artifact. Nothing is
#            published from a PR: unreviewed code never reaches a public page.
# Test lane: push to main → unit tests + debug APK → the `coreeq-test`
#            prerelease (public, marked prerelease, never "latest").
# Release:   push a coreeq-v* tag on main → signed release APK → versioned
#            GitHub Release + the floating `coreeq` release (stable URL for a
#            Downloader code, once one is generated).
#
# Tag prefix is "coreeq-v", declared in suite.json; check_suite_truth.py
# refuses any workflow tag glob that is not a declared prefix.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'coreeq/**'
      - '.github/workflows/core-eq-apk.yml'
  push:
    branches: [main]
    paths:
      - 'coreeq/**'
      - '.github/workflows/core-eq-apk.yml'
    tags: ['coreeq-v*']

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check suite truth
        run: python tools/check_suite_truth.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Lint runs in the same Gradle call so a manifest or resource error
      # (e.g. ProtectedPermissions on DUMP) fails the PR, not a later build.
      - name: Run unit tests and lint
        working-directory: coreeq
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/coreeq-gradle.log"

      # The action log archive is not always reachable from this runner; emit
      # concise failures as check annotations as well as in the full log.
      - name: Summarize unit-test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          failures = []
          for path in Path("coreeq/app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  for node in list(case.findall("failure")) + list(case.findall("error")):
                      detail = " ".join(filter(None, [node.get("message", ""), node.text or ""]))
                      failures.append(f"{case.get('classname', '?')}#{case.get('name', '?')}: {detail[:2400]}")

          gradle_log = Path(os.environ["RUNNER_TEMP"]) / "coreeq-gradle.log"
          if not failures and gradle_log.is_file():
              lines = gradle_log.read_text(errors="replace").splitlines()
              needles = ("e: ", "error:", "What went wrong:", "Execution failed for task", "BUILD FAILED")
              failures = [line.strip() for line in lines if any(n in line for n in needles)][-20:]
              if not failures:
                  failures = lines[-25:]

          if not failures:
              failures = ["Gradle failed before producing a test report; inspect the full job log."]
          summary = "\n".join(f"- {item}" for item in failures)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("## Core EQ test failure details\n\n" + summary + "\n")
          for item in failures:
              escaped = item.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Core EQ unit-test failure::{escaped}")
          PY

  apk:
    name: Assemble APK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to build a tag that is not on main
        if: startsWith(github.ref, 'refs/tags/coreeq-v')
        run: |
          git fetch origin main --depth=50
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not an ancestor of main"; exit 1; }
          TAG="${GITHUB_REF_NAME#coreeq-v}"
          GRADLE=$(grep -oP 'versionName = "\K[^"]+' coreeq/app/build.gradle.kts)
          [ "$TAG" = "$GRADLE" ] \
            || { echo "::error::tag $TAG != versionName $GRADLE"; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/coreeq-v') && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Keystore decoded — release will be signed."

      - name: Assemble release APK
        if: startsWith(github.ref, 'refs/tags/coreeq-v')
        working-directory: coreeq
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release APK is signed
        if: startsWith(github.ref, 'refs/tags/coreeq-v')
        run: |
          APK=$(ls coreeq/app/build/outputs/apk/release/*.apk)
          case "$APK" in
            *-unsigned.apk)
              echo "::error::$APK is unsigned — a tagged release must be installable."
              exit 1
              ;;
          esac
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"

      - name: Name the release APK for the stable URL
        if: startsWith(github.ref, 'refs/tags/coreeq-v')
        run: |
          SRC=$(ls coreeq/app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          mkdir -p dist
          cp "$SRC" dist/coreeq-release.apk
          ls -lh dist/coreeq-release.apk

      - name: Assemble debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/coreeq-v') }}
        working-directory: coreeq
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Name the debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/coreeq-v') }}
        run: |
          APK=$(find coreeq/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/coreeq-debug.apk
          (cd dist && sha256sum coreeq-debug.apk > coreeq-debug.apk.sha256)
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: CoreEQ-${{ startsWith(github.ref, 'refs/tags/coreeq-v') && 'release' || 'debug' }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/coreeq-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Immutable releases: attach assets to a draft, then publish.
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --draft --generate-notes --verify-tag \
            dist/coreeq-release.apk
          gh release edit "$TAG" --draft=false --latest=false

      - name: Point floating tag coreeq at this commit
        if: startsWith(github.ref, 'refs/tags/coreeq-v')
        run: |
          git tag -f coreeq "$GITHUB_SHA"
          git push -f origin refs/tags/coreeq

      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/coreeq-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete coreeq --yes 2>/dev/null || true
          gh release create coreeq --draft \
            --title "Core EQ (latest)" \
            --notes "Always the current Core EQ APK. Versioned notes live on coreeq-v* releases. Stable URL: https://github.com/brevityA/CoreBuildsApps/releases/download/coreeq/coreeq-release.apk" \
            dist/coreeq-release.apk
          gh release edit coreeq --draft=false --latest=false

      # The test lane publishes merged code only: pushes to main, never PRs or
      # agent branches, so the public prerelease always reflects reviewed code.
      - name: Publish to the coreeq-test prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="coreeq-test"
          REPO="$GITHUB_REPOSITORY"
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
          VERSION=$(grep -oP 'versionName = "\K[^"]+' coreeq/app/build.gradle.kts)
          TITLE="Core EQ — test channel (tv.corebuilds.eq)"
          NOTES="Debug build of Core EQ $VERSION from main at ${GITHUB_SHA::7}. Installs beside a release build (package tv.corebuilds.eq.debug). Changes: coreeq/CHANGELOG.md."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" \
              --draft=false --prerelease --latest=false \
              --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$REPO" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload "$TAG" dist/coreeq-debug.apk dist/coreeq-debug.apk.sha256 --repo "$REPO" --clobber
