name: Core Builds Pop APK

# Builds Core Builds Pop (pop/) — the pop-art cartoon icon pack.
#
# Pop shares tools/catalog.json and the Kotlin in app/src/main/java with the
# classic pack, and shares the root Gradle build as the :pop module. What it
# does not share is its package ID, its release tag, or its update manifest,
# so shipping one pack never moves the other.
#
# CI:      push/PR touching pop/, tools/, or app/ sources → regenerate, diff, build
# Release: push a pop-v* tag → signed release APK → GitHub Release + floating `pop` tag
#
# Tag prefix is "pop-v" so it never collides with the icon pack's v* tags,
# Core Line's coreline-v*, Core Shift's shift-v*, or Core Motion's motion-v*.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pop/**'
      - 'tools/popart.py'
      - 'tools/build_pop.py'
      - 'tools/measure_pop_glyphs.py'
      - 'tools/validate_pop.py'
      - 'tools/pop_glyph_metrics.json'
      - 'tools/catalog.json'
      - 'tools/glyphs.py'
      - 'app/src/main/java/**'
      - 'app/src/main/res/layout/**'
      - 'app/src/main/res/values/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'Latestrelease/pop-version.json'
      - 'settings.gradle.kts'
      - '.github/workflows/pop-apk.yml'
  push:
    branches: [main]
    tags: ['pop-v*']

permissions:
  contents: write

jobs:
  assets:
    name: Regenerate and validate Pop assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check suite truth
        run: python tools/check_suite_truth.py

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install render deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2
          pip install --quiet -r tools/requirements.txt

      - name: Regenerate Pop from the catalog
        run: python tools/build_pop.py

      - name: Verify committed assets match the catalog
        # Same contract as the classic pack, and the same scoping rationale:
        # PNG bytes move with the rasteriser's version, XML mappings do not.
        # A stale PNG is cosmetic; a stale appfilter is a pack that does not
        # apply. This also proves the app/ -> pop/ resource mirror is current,
        # since build_pop.py rewrites it every run.
        run: |
          DRIFT=$(git status --porcelain -- '*.xml' '*.svg' '*.md' | grep -v '^?? ' || true)
          if [ -n "$DRIFT" ]; then
            echo "::error::Generated Pop files differ from committed ones."
            echo "Run: python tools/build_pop.py"
            echo "$DRIFT"
            git --no-pager diff -- '*.xml' '*.svg' '*.md'
            exit 1
          fi
          echo "Text assets verified in sync with tools/catalog.json"

      - name: Validate Pop
        run: python tools/validate_pop.py

  apk:
    name: Assemble APK
    needs: assets
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Check suite truth
        run: python tools/check_suite_truth.py

      - name: Refuse to build a tag that is not on main
        if: startsWith(github.ref, 'refs/tags/pop-v')
        run: |
          git fetch origin main --depth=50
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not an ancestor of main"; exit 1; }
          TAG="${GITHUB_REF_NAME#pop-v}"
          GRADLE=$(grep -oP 'versionName = "\K[^"]+' pop/build.gradle.kts)
          [ "$TAG" = "$GRADLE" ] \
            || { echo "::error::tag $TAG != versionName $GRADLE"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Keystore decoded — release will be signed."

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :pop:assembleRelease --no-daemon

      - name: Verify the APK is signed before releasing
        if: startsWith(github.ref, 'refs/tags/pop-v')
        run: |
          APK=$(ls pop/build/outputs/apk/release/*.apk)
          echo "Verifying $APK"
          case "$APK" in
            *-unsigned.apk)
              echo "::error::$APK is unsigned — a tagged release must be installable."
              echo "KEYSTORE_BASE64 is unset or failed to decode. See PUBLISHING.md step 4."
              exit 1
              ;;
          esac
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          echo "APK signature verified."

      - name: Name the APK for the stable Downloader URL
        if: startsWith(github.ref, 'refs/tags/pop-v')
        run: |
          SRC=$(ls pop/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          mkdir -p dist
          cp "$SRC" dist/corepop-release.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: core-builds-pop
          path: pop/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Sync the update manifest to the published tag
        if: startsWith(github.ref, 'refs/tags/pop-v')
        run: |
          TAG="${GITHUB_REF_NAME#pop-v}"
          python - "$TAG" <<'PY'
          import json, re, sys
          tag = sys.argv[1]
          gradle = open('pop/build.gradle.kts').read()
          code = int(re.search(r'versionCode\s*=\s*(\d+)', gradle).group(1))
          p = 'Latestrelease/pop-version.json'
          d = json.load(open(p))
          d['versionCode'] = code
          d['versionName'] = tag
          json.dump(d, open(p, 'w'), indent=2)
          open(p, 'a').write('\n')
          print(f'pop-version.json -> {tag} / {code}')
          PY
          if ! git diff --quiet -- Latestrelease/pop-version.json; then
            cp Latestrelease/pop-version.json /tmp/pop-version.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git fetch origin main --depth=50
            git checkout -B _pop-version-sync origin/main
            cp /tmp/pop-version.json Latestrelease/pop-version.json
            git add Latestrelease/pop-version.json
            git commit -m "chore: sync Pop update manifest to ${GITHUB_REF_NAME}"
            git push origin _pop-version-sync:main
          fi

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/pop-v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/corepop-release.apk
          generate_release_notes: true
          make_latest: false

      - name: Point floating tag pop at this commit
        if: startsWith(github.ref, 'refs/tags/pop-v')
        run: |
          git tag -f pop "$GITHUB_SHA"
          git push -f origin refs/tags/pop

      - name: Publish stable Downloader release
        if: startsWith(github.ref, 'refs/tags/pop-v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: pop
          name: Core Builds Pop (latest)
          body: |
            Always the current Core Builds Pop APK. Versioned notes live on `pop-v*` releases.

            https://github.com/brevityA/CoreBuildsApps/releases/download/pop/corepop-release.apk
          files: dist/corepop-release.apk
          fail_on_unmatched_files: true
          make_latest: false
