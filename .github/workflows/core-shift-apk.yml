name: Core Shift APK

# Builds the Core Shift motion wallpaper app (shift/) and validates
# the motion asset set. The Android project is standalone — it has its
# own Gradle root at shift/ and is not part of the icon-pack or Core
# Line builds.
#
# CI:       push/PR on shift/**/Motion/**/tools/workflow → validate + debug APK artifact
# Release:  push a shift-v* tag → validate + signed release APK → GitHub Release
#
# Tag prefix is "shift-v" so it never collides with the icon pack's
# v* tags or Core Line's coreline-v* tags.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'shift/**'
      - 'Motion/**'
      - 'tools/validate_motion.py'
      - '.github/workflows/core-shift-apk.yml'
  push:
    branches: [main]
    tags: ['shift-v*']

permissions:
  contents: write

jobs:
  validate:
    name: Validate motion assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run motion validation
        run: python tools/validate_motion.py

  apk:
    name: Assemble APK
    needs: validate
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to build a tag that is not on main
        if: startsWith(github.ref, 'refs/tags/shift-v')
        run: |
          git fetch origin main --depth=50
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not an ancestor of main"; exit 1; }
          TAG="${GITHUB_REF_NAME#shift-v}"
          GRADLE=$(grep -oP 'versionName = "\K[^"]+' shift/app/build.gradle.kts)
          [ "$TAG" = "$GRADLE" ] \
            || { echo "::error::tag $TAG != versionName $GRADLE"; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Keystore decoded — release will be signed."

      - name: Assemble release APK
        if: startsWith(github.ref, 'refs/tags/shift-v')
        working-directory: shift
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Assemble debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/shift-v') }}
        working-directory: shift
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify release APK is signed
        if: startsWith(github.ref, 'refs/tags/shift-v')
        run: |
          APK=$(ls shift/app/build/outputs/apk/release/*.apk)
          echo "Verifying $APK"
          case "$APK" in
            *-unsigned.apk)
              echo "::error::$APK is unsigned — a tagged release must be installable."
              exit 1
              ;;
          esac
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          echo "APK signature verified."

      - name: Name the APK for the stable Downloader URL
        if: startsWith(github.ref, 'refs/tags/shift-v')
        run: |
          SRC=$(ls shift/app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          mkdir -p dist
          cp "$SRC" dist/coreshift-release.apk
          ls -lh dist/coreshift-release.apk
          echo "SHIFT_APK=$PWD/dist/coreshift-release.apk" >> "$GITHUB_ENV"

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/shift-v') }}
        uses: actions/upload-artifact@v7
        with:
          name: CoreShift-debug
          path: shift/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        if: startsWith(github.ref, 'refs/tags/shift-v')
        uses: actions/upload-artifact@v7
        with:
          name: CoreShift-release
          path: dist/coreshift-release.apk
          if-no-files-found: error

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/shift-v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/coreshift-release.apk
          generate_release_notes: true
          name: "Core Shift ${{ github.ref_name }}"
          make_latest: false

      - name: Point floating tag shift at this commit
        if: startsWith(github.ref, 'refs/tags/shift-v')
        run: |
          git tag -f shift "$GITHUB_SHA"
          git push -f origin refs/tags/shift

      - name: Publish stable Downloader release
        if: startsWith(github.ref, 'refs/tags/shift-v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: shift
          name: Core Shift (latest)
          body: |
            Always the current Core Shift APK. Versioned notes live on `shift-v*` releases.

            Downloader (generate the numeric code **once** at https://go.aftvnews.com/):
            https://github.com/brevityA/CoreBuildsApps/releases/download/shift/coreshift-release.apk
          files: dist/coreshift-release.apk
          fail_on_unmatched_files: true
          make_latest: false
