name: Render Series 2/3 prequel motion

on:
  workflow_dispatch:
    inputs:
      set:
        description: Preset set to render
        required: true
        default: series-2-3
        type: choice
        options:
          - series-2-3
          - series-2-motion
          - series-3-horizons
      tier:
        description: Quality tiers to publish
        required: true
        default: both
        type: choice
        options:
          - both
          - 1080p
          - 4k
      only:
        description: Optional slug or number, comma separated
        required: false
        default: ''
      speed:
        description: Motion speed profile used for both quality tiers
        required: true
        default: '1.0'
        type: choice
        options:
          - '0.5'
          - '1.0'
          - '2.0'
      duration:
        description: Loop length in seconds
        required: true
        default: '20'
        type: choice
        options:
          - '10'
          - '20'
          - '30'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Mesa software OpenGL and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dri libegl1 xvfb ffmpeg

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        run: pip install --quiet moderngl numpy imageio-ffmpeg

      - name: Render selected quality tiers
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PREQUEL_ONLY: ${{ inputs.only }}
        run: |
          EXTRA=''
          if [ -n "$PREQUEL_ONLY" ]; then
            IFS=',' read -ra PICKS <<< "$PREQUEL_ONLY"
            for pick in "${PICKS[@]}"; do EXTRA="$EXTRA --only $pick"; done
          fi
          xvfb-run -a python tools/build_prequel_bundle.py \
            --set "${{ inputs.set }}" --tier "${{ inputs.tier }}" \
            --speed "${{ inputs.speed }}" --duration "${{ inputs.duration }}" $EXTRA

      - name: Validate generated clips and feed
        run: python tools/validate_prequel_motion.py --generated Motion/prequel

      - uses: actions/upload-artifact@v4
        with:
          name: core-motion-prequels-${{ inputs.set }}-${{ inputs.tier }}
          path: Motion/prequel/
          if-no-files-found: error

      - name: Publish stable prequel release assets (retrying sequential uploader)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=motion-prequels
          TITLE="Core Motion prequels (latest render)"
          NOTES="Procedural Series 2 and Series 3 Core Motion prequels generated by Core Prequel Engine. The feed contains the published quality tiers."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --prerelease=false
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

          upload_with_retry() {
            local file="$1"
            local attempt
            for attempt in 1 2 3 4 5 6; do
              echo "Uploading $file (attempt $attempt/6)"
              if gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber; then
                return 0
              fi
              if [ "$attempt" -lt 6 ]; then
                sleep $((attempt * 10))
              fi
            done
            echo "::error::Failed to upload $file after 6 attempts"
            return 1
          }

          # Upload one file at a time. The previous multi-asset action lost its
          # connection partway through the 4K set ("other side closed"), leaving
          # a feed that referenced one missing MP4. --clobber makes reruns safe.
          while IFS= read -r -d '' file; do
            upload_with_retry "$file"
          done < <(find Motion/prequel -maxdepth 1 -type f -print0 | sort -z)

          expected_names=$(find Motion/prequel -maxdepth 1 -type f -printf '%f\n' | sort)
          actual_names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          missing=$(comm -23 <(printf '%s\n' "$expected_names") <(printf '%s\n' "$actual_names"))
          if [ -n "$missing" ]; then
            echo "::error::Release is missing uploaded files:"
            echo "$missing"
            exit 1
          fi
          echo "Release asset verification passed for $(printf '%s\\n' "$expected_names" | wc -l) files."