name: Render Series 2/3 prequel motion

# Production renderer for the procedural prequel set. It is manual by design:
# rendering 16 20-second 1080p clips on Mesa is intentionally not part of the
# APK validation path. The output is an artifact that can be reviewed before
# promoting anything into the shared live feed.

on:
  workflow_dispatch:
    inputs:
      set:
        description: Preset set to render
        required: true
        default: series-2-3
        type: choice
        options:
          - series-2-3
          - series-2-motion
          - series-3-horizons
      resolution:
        description: Render resolution
        required: true
        default: 1920x1080
        type: choice
        options:
          - 1920x1080
          - 3840x2160
      only:
        description: Optional slug or number, comma separated
        required: false
        default: ''

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Mesa software OpenGL and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dri libegl1 xvfb ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        run: pip install --quiet moderngl numpy imageio-ffmpeg

      - name: Render prequel set
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          IFS=x read -r WIDTH HEIGHT <<< "${{ inputs.resolution }}"
          EXTRA=''
          if [ -n "${{ inputs.only }}" ]; then
            IFS=',' read -ra PICKS <<< "${{ inputs.only }}"
            for pick in "${PICKS[@]}"; do EXTRA="$EXTRA --only $pick"; done
          fi
          xvfb-run -a python tools/build_prequel_motion.py \
            --set "${{ inputs.set }}" --width "$WIDTH" --height "$HEIGHT" $EXTRA

      - name: Validate generated clips and feed
        run: python tools/validate_prequel_motion.py --generated Motion/prequel

      - uses: actions/upload-artifact@v4
        with:
          name: core-motion-prequels-${{ inputs.set }}-${{ inputs.resolution }}
          path: Motion/prequel/
          if-no-files-found: error

      # The feed URLs point at this stable release tag. Re-running the workflow
      # refreshes the same reviewable delivery lane without adding MP4 blobs to
      # the git history.
      - name: Publish stable prequel release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: motion-prequels
          name: Core Motion prequels (latest render)
          body: |
            Procedural Series 2 and Series 3 Core Motion prequels generated by
            Core Prequel Engine. Feed: prequel-feed.json. Requires a launcher
            that accepts an Overflight-compatible custom feed.
          files: Motion/prequel/*
          fail_on_unmatched_files: true
          make_latest: false
          draft: false
