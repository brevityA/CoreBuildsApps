name: Coverage report refresh

# Weekly cross-check of the GitHub tracker against the bundled appfilter
# (tools/coverage_report.py): which requested apps are in the pack now, which
# reported components ship now (the first-fix rate), and how fast the loop
# turns. Commits docs/COVERAGE.md so the numbers can be cited in issue
# replies and listings without re-deriving them; the CI gate
# (coverage_report.py --check, no network) fails if the refresh lapses.

on:
  schedule:
    # Sunday 06:00 UTC, before the week's first work session.
    - cron: "0 6 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cross-check the tracker against the bundled appfilter
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/coverage_report.py --write
      - name: Commit the report if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/COVERAGE.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh coverage report"
            git push
          fi
