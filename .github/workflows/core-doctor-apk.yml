name: Core Doctor APK

# Builds the Core Doctor diagnostics app (doctor/). Standalone Gradle
# root — not part of the icon-pack, Core Line, or Core Shift builds.
#
# CI:       push/PR on doctor/** or workflow → unit tests + debug APK artifact
# Release:  push a doctor-v* tag → signed release APK → GitHub Release
#
# Tag prefix is "doctor-v" so it never collides with the icon pack's
# v* tags, Core Line's coreline-v* tags, or Core Shift's shift-v* tags.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'doctor/**'
      - '.github/workflows/core-doctor-apk.yml'
  push:
    branches: [main]
    tags: ['doctor-v*']

permissions:
  contents: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        working-directory: doctor
        run: ./gradlew :app:test --no-daemon --stacktrace

  apk:
    name: Assemble APK
    needs: test
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to build a tag that is not on main
        if: startsWith(github.ref, 'refs/tags/doctor-v')
        run: |
          git fetch origin main --depth=50
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not an ancestor of main"; exit 1; }
          TAG="${GITHUB_REF_NAME#doctor-v}"
          GRADLE=$(grep -oP 'versionName = "\K[^"]+' doctor/app/build.gradle.kts)
          [ "$TAG" = "$GRADLE" ] \
            || { echo "::error::tag $TAG != versionName $GRADLE"; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Keystore decoded — release will be signed."

      - name: Assemble release APK
        if: startsWith(github.ref, 'refs/tags/doctor-v')
        working-directory: doctor
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Assemble debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/doctor-v') }}
        working-directory: doctor
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify release APK is signed
        if: startsWith(github.ref, 'refs/tags/doctor-v')
        run: |
          APK=$(ls doctor/app/build/outputs/apk/release/*.apk)
          echo "Verifying $APK"
          case "$APK" in
            *-unsigned.apk)
              echo "::error::$APK is unsigned — a tagged release must be installable."
              exit 1
              ;;
          esac
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          echo "APK signature verified."

      - name: Name the APK for the stable Downloader URL
        if: startsWith(github.ref, 'refs/tags/doctor-v')
        run: |
          SRC=$(ls doctor/app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          mkdir -p dist
          cp "$SRC" dist/coredoctor-release.apk
          ls -lh dist/coredoctor-release.apk
          echo "DOCTOR_APK=$PWD/dist/coredoctor-release.apk" >> "$GITHUB_ENV"

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/doctor-v') }}
        uses: actions/upload-artifact@v7
        with:
          name: CoreDoctor-debug
          path: doctor/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        if: startsWith(github.ref, 'refs/tags/doctor-v')
        uses: actions/upload-artifact@v7
        with:
          name: CoreDoctor-release
          path: dist/coredoctor-release.apk
          if-no-files-found: error

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/doctor-v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/coredoctor-release.apk
          generate_release_notes: true
          name: "Core Doctor ${{ github.ref_name }}"
          make_latest: false

      - name: Point floating tag doctor at this commit
        if: startsWith(github.ref, 'refs/tags/doctor-v')
        run: |
          git tag -f doctor "$GITHUB_SHA"
          git push -f origin refs/tags/doctor

      - name: Publish stable Downloader release
        if: startsWith(github.ref, 'refs/tags/doctor-v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: doctor
          name: Core Doctor (latest)
          body: |
            Always the current Core Doctor APK. Versioned notes live on `doctor-v*` releases.

            Downloader (generate the numeric code **once** at https://go.aftvnews.com/):
            https://github.com/brevityA/CoreBuildsApps/releases/download/doctor/coredoctor-release.apk
          files: dist/coredoctor-release.apk
          fail_on_unmatched_files: true
          make_latest: false
