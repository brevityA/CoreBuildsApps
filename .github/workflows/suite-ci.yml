name: Suite CI gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Release/update contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check suite truth
        run: python tools/check_suite_truth.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check every appfilter drawable exists in the res tree
        run: python tools/check_appfilter_integrity.py
      # Reads res/ and the Kotlin of all three app modules, stdlib only. It was
      # a local-only gate for eleven releases: nothing in CI ever asked whether
      # a layout referenced a string, dimen or drawable that does not exist, or
      # whether a nextFocus chain stranded a focusable view.
      - name: Check every UI resource the three modules reference
        run: python tools/check_ui_resources.py
      # Core Shift's live-wallpaper feed. AGENTS.md has documented it as a
      # verification step since the feed landed, and no workflow ran it.
      - name: Check the Core Shift live-feed against its media
        run: python tools/validate_motion_feed.py
      - name: Assert every shippable app has CI, metadata, and hardened updater contracts
        run: python tools/audit_contract.py
      - name: Check prefilled icon-request links against the issue forms
        run: python tools/build_issue_prefills.py --check
      - name: Check the Banners companion matches the glyph pack
        run: python tools/build_banners_pack.py --check
      # Depends on no Android SDK and no Gradle, so it runs here rather than in
      # the matrix: it is the check that explains *why* a matrix entry would
      # fail, and it has to be able to fail on a dependency-only PR that never
      # reaches a build.
      - name: Check the Android build envelope
        run: python tools/check_gradle_envelope.py
      - name: Check dependabot.yml matches its generator
        run: python tools/build_dependabot.py --check

  android:
    name: ${{ matrix.name }} build lint tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Icon Pack
            dir: .
            tasks: :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
            gradle: app/build.gradle.kts
            compileSdk: 34
            workflow: .github/workflows/build.yml
            artifact: app/build/outputs/apk/debug/*.apk
          - name: Core Builds Glyphs
            dir: .
            tasks: :glyphs:lintDebug :glyphs:testDebugUnitTest :glyphs:assembleDebug
            gradle: glyphs/build.gradle.kts
            compileSdk: 34
            workflow: .github/workflows/build.yml
            artifact: glyphs/build/outputs/apk/debug/*.apk
          - name: Core Line
            dir: ticker/android
            tasks: :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
            gradle: ticker/android/app/build.gradle.kts
            compileSdk: 34
            workflow: .github/workflows/core-line-apk.yml
            artifact: ticker/android/app/build/outputs/apk/debug/*.apk
          - name: Core Shift
            dir: shift
            tasks: :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
            gradle: shift/app/build.gradle.kts
            compileSdk: 34
            workflow: .github/workflows/core-shift-apk.yml
            artifact: shift/app/build/outputs/apk/debug/*.apk
          - name: Core Doctor
            dir: doctor
            tasks: :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
            gradle: doctor/app/build.gradle.kts
            compileSdk: 35
            workflow: .github/workflows/core-doctor-apk.yml
            artifact: doctor/app/build/outputs/apk/debug/*.apk
          - name: Core Motion plugin
            dir: motion-plugin
            tasks: :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
            gradle: motion-plugin/app/build.gradle.kts
            compileSdk: 34
            workflow: .github/workflows/core-motion-apk.yml
            artifact: motion-plugin/app/build/outputs/apk/debug/*.apk
    steps:
      - uses: actions/checkout@v4

      - name: Check suite truth
        run: python tools/check_suite_truth.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Parameterised off the matrix on purpose. This used to install android-34
      # for every entry including Core Doctor, which compiles against 35. That
      # was harmless only by luck — ubuntu-latest happens to preinstall both, so
      # the step no-ops in ~6s either way and doctor compiled against the image's
      # copy of 35. Had the image not carried it, AGP would have silently
      # auto-downloaded it mid-build (it does, once the runner has accepted the
      # SDK licences), and a runner-image change would have turned a passing job
      # into a slow or failing one with nothing in this file to explain why.
      # Stating the platform per entry makes the job declare its own requirement;
      # tools/check_gradle_envelope.py asserts that declaration matches the
      # compileSdk in the build file it points at.
      - name: Install Android platform ${{ matrix.compileSdk }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-${{ matrix.compileSdk }}" \
            "build-tools;${{ matrix.compileSdk }}.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify tracked workflow/build files exist
        run: |
          test -f "${{ matrix.gradle }}"
          test -f "${{ matrix.workflow }}"
      - name: Build, lint, and unit test
        working-directory: ${{ matrix.dir }}
        run: ./gradlew ${{ matrix.tasks }} --no-daemon --stacktrace
      - name: Surface build errors as annotations
        if: failure()
        working-directory: ${{ matrix.dir }}
        run: |
          # Re-run compile + lint (config-cache warm, cheap) with all output
          # captured, then post the failure cause and first errors as
          # annotations - readable without downloading job logs.
          # The module comes from this entry's own tasks (":glyphs:lintDebug ..."
          # -> glyphs), so a Glyphs failure reports Glyphs, not
          # :app. compileDebugSources covers Java-only modules too.
          MOD=$(printf '%s' "${{ matrix.tasks }}" | awk '{print $1}' | cut -d: -f2)
          ./gradlew ":$MOD:compileDebugSources" ":$MOD:lintDebug" --no-daemon > build_out.txt 2>&1 || true
          {
            grep -A 8 "What went wrong" build_out.txt | head -10 || true
            grep -E "^e: |error: " build_out.txt | head -5 || true
            LINT_TXT=$(find "$MOD/build" -name "lint-results-*.txt" 2>/dev/null | head -1)
            if [ -n "$LINT_TXT" ]; then
              grep -iE "Error" "$LINT_TXT" | head -4 || true
            fi
          } | while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }} debug APK
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  web-and-content:
    name: Web/content tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check suite truth
        run: python tools/check_suite_truth.py
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core Line parser/network tests
        run: cd ticker && npm test
      - name: Install Python content deps
        run: pip install --quiet -r tools/requirements.txt
      # Both import tools/glyphs.py, which needs fontTools from the deps above.
      - name: Check the Classic glyph fit matches the catalog and metrics
        run: python tools/fit_classic_glyphs.py --check
      - name: Check fallback palette colours match their assignment
        run: python tools/icon_palette.py --check
      # This job installs the render deps and runs no asset builder, so the
      # rasters the frames paste are the committed ones. build.yml runs the
      # same check, ahead of its regeneration step, for that reason. The check
      # compares sources and drawn structure rather than PNG bytes - text
      # rendering is not reproducible across machines - so it fails on a layout
      # nobody regenerated, not on a runner's rasteriser.
      - name: Check the committed UI frames depict the source
        run: python tools/build_app_ui_mockups.py --check
      - name: Python content tests
        run: |
          python tests/test_icon_identity.py
          python tests/test_v151_robustness.py
          python tests/test_wallpapers.py
          python tests/test_wallpaper_export.py
          python tests/test_live_wallpaper.py
          python tests/test_core_shift_content.py
          python tests/test_core_shift_screensaver.py
          python tests/test_prequel_engine.py
          python tests/test_devcontainer.py
          python tests/test_tv_layout_fit.py
          python tests/test_search_focus.py
          python tests/test_icon_uniformity.py
          python tests/test_ui_wiring.py
          python tests/test_brandmark_badge.py
          python tests/test_gradle_envelope.py
          python tests/test_navigation_graph.py
          python tests/test_tv_scale.py
          python tests/test_mapping_hygiene.py
          python tests/test_monet_handoff.py
          python tests/test_presence.py
          python tests/test_render_stack.py
          python tests/test_changelog_contract.py
          python tests/test_glyphs_pack.py
          python tests/test_icon_palette.py
          python tests/test_update_manifest_gate.py
          # Meta-gate, last: it reads the workflows above and fails if any
          # tests/test_*.py or tools/check_*.py has stopped being invoked. This
          # job has no path filter, so it is the one place a new test can be
          # wired and be certain to run on every push and PR.
          python tests/test_ci_coverage.py
