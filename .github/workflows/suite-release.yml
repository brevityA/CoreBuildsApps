name: Suite release

on:
  push:
    tags:
      - 'iconpack-v*'
      - 'coreline-v*'
      - 'shift-v*'
      - 'doctor-v*'
      - 'motion-v*'
  workflow_dispatch:
    inputs:
      app:
        description: App to release/dry-run
        type: choice
        required: true
        default: coreline
        options: [iconpack, coreline, coreshift, coredoctor, coremotion]
      publish:
        description: Publish GitHub Release assets (false = dry-run artifacts only)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.pick.outputs.app }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "app=${{ inputs.app }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
          else
            case "${GITHUB_REF_NAME}" in
              iconpack-v*) echo "app=iconpack" >> "$GITHUB_OUTPUT" ;;
              coreline-v*) echo "app=coreline" >> "$GITHUB_OUTPUT" ;;
              shift-v*) echo "app=coreshift" >> "$GITHUB_OUTPUT" ;;
              doctor-v*) echo "app=coredoctor" >> "$GITHUB_OUTPUT" ;;
              motion-v*) echo "app=coremotion" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::unknown release tag ${GITHUB_REF_NAME}"; exit 1 ;;
            esac
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: select
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check suite truth
        run: python tools/check_suite_truth.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Refuse published release without signing secrets
        if: needs.select.outputs.publish == 'true' && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::KEYSTORE_BASE64 is required for published releases"
          exit 1
      - name: Build selected app APK/AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          case "${{ needs.select.outputs.app }}" in
            iconpack) DIR=. ; APK=app/build/outputs/apk/release/*.apk ; AAB=app/build/outputs/bundle/release/*.aab ; OUT=iconpack-release.apk ;;
            coreline) DIR=ticker/android ; APK=ticker/android/app/build/outputs/apk/release/*.apk ; AAB=ticker/android/app/build/outputs/bundle/release/*.aab ; OUT=coreline-release.apk ;;
            coreshift) DIR=shift ; APK=shift/app/build/outputs/apk/release/*.apk ; AAB=shift/app/build/outputs/bundle/release/*.aab ; OUT=coreshift-release.apk ;;
            coredoctor) DIR=doctor ; APK=doctor/app/build/outputs/apk/release/*.apk ; AAB=doctor/app/build/outputs/bundle/release/*.aab ; OUT=coredoctor-release.apk ;;
            coremotion) DIR=motion-plugin ; APK=motion-plugin/app/build/outputs/apk/release/*.apk ; AAB=motion-plugin/app/build/outputs/bundle/release/*.aab ; OUT=coremotion-release.apk ;;
          esac
          (cd "$DIR" && ./gradlew :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace)
          mkdir -p dist
          cp $(ls $APK | grep -v unsigned | head -1) "dist/$OUT"
          if compgen -G "$AAB" >/dev/null; then cp $(ls $AAB | head -1) dist/; fi
          ls -lh dist
      - name: Verify published APK signature
        if: needs.select.outputs.publish == 'true'
        run: |
          APK=$(ls dist/*-release.apk)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
      - name: Generate updater metadata with SHA-256
        if: contains('iconpack coreline coreshift', needs.select.outputs.app)
        run: |
          python tools/generate_release_metadata.py "${{ needs.select.outputs.app }}" --apk dist/*-release.apk --out dist/update-metadata.json
      - name: Sync updater metadata back to main
        if: needs.select.outputs.publish == 'true' && contains('iconpack coreline coreshift', needs.select.outputs.app)
        run: |
          set -euo pipefail
          case "${{ needs.select.outputs.app }}" in
            iconpack) META=Latestrelease/version.json ;;
            coreline) META=Latestrelease/coreline-version.json ;;
            coreshift) META=Latestrelease/shift-version.json ;;
          esac
          cp dist/update-metadata.json /tmp/update-metadata.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=50
          git checkout -B _release-metadata origin/main
          cp /tmp/update-metadata.json "$META"
          python tools/audit_contract.py
          if ! git diff --quiet -- "$META"; then
            git add "$META"
            git commit -m "chore: sync ${{ needs.select.outputs.app }} updater metadata for ${GITHUB_REF_NAME}"
            git push origin _release-metadata:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.select.outputs.app }} release checklist artifacts
          path: |
            dist/**
            docs/RELEASE-INFRA.md
          if-no-files-found: error
      - name: Publish GitHub Release assets
        if: needs.select.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**
          generate_release_notes: true
          make_latest: false
      - name: Write release checklist summary
        run: |
          {
            echo "# Release checklist: ${{ needs.select.outputs.app }}"
            echo "- APK built: yes"
            echo "- AAB built for Play upload: yes"
            echo "- Signing enforced on published tags: ${{ needs.select.outputs.publish }}"
            echo "- Updater metadata/hash generated where applicable: see dist/update-metadata.json"
            echo "- Keystore source: GitHub Actions secrets only"
          } >> "$GITHUB_STEP_SUMMARY"
