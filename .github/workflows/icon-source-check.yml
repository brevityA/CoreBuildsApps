name: Inspect TVLok icon source (temporary)

# Branch-only research for #352. Remove before the feature PR is ready.
# The APK is downloaded from the vendor and inspected as data, never installed
# or executed. No signing keys, publishing permissions or APK redistribution.
on:
  push:
    branches: ['arena/9cfea1e4-corebuildsapps']
    paths: ['.github/workflows/icon-source-check.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install optional static inspection dependencies
        run: pip install --quiet androguard==4.1.4 Pillow==10.4.0
      - name: Fetch the version linked by the official download page
        env:
          APK_URL: https://downloads.tvlok.com/releases/android/tvlok-1.0.192-1129-A627B2A4F6A3E09CF17549F2407DE3D04B226B44AAB6B3375E53E7760AB47B63.apk
        run: |
          mkdir -p build/icon-source
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 180 --max-filesize 100000000 \
            "$APK_URL" -o build/icon-source/tvlok.apk
          echo 'a627b2a4f6a3e09cf17549f2407de3d04b226b44aab6b3375e53e7760ab47b63  build/icon-source/tvlok.apk' | sha256sum --check
          python tools/inspect_icon_apk.py build/icon-source/tvlok.apk \
            --source-url "$APK_URL" --output build/icon-source/tvlok
      - name: Expose the small manifest and artwork evidence through check annotations
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          from pathlib import Path
          from PIL import Image

          def notice(title, text):
              # APK strings are data, not workflow commands. Escape all command
              # delimiters before emitting an annotation.
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title={title}::{text}')

          root = Path('build/icon-source/tvlok')
          receipt = (root / 'receipt.json').read_text()
          notice('TVLok static inspection receipt', receipt)
          data = json.loads(receipt)
          for index, entry in enumerate(data['resources']):
              path = root / entry['path']
              # Compact visual references only. Keep the original APK/resource
              # hashes in the receipt, and label these downsized derivatives
              # explicitly rather than presenting them as original bytes.
              original = Image.open(path).convert('RGBA')
              for limit in (192, 128):
                  sample = original.copy()
                  sample.thumbnail((limit, limit), Image.Resampling.LANCZOS)
                  buf = io.BytesIO()
                  sample.save(buf, format='PNG', optimize=True)
                  raw = buf.getvalue()
                  if len(raw) <= 32000:
                      break
              if len(raw) > 32000:
                  raise ValueError('Reference thumbnail exceeds the annotation limit')
              payload = json.dumps({
                  'path': 'preview/' + path.name,
                  'source_resource': entry['path'],
                  'source_sha256': entry['export_sha256'],
                  'source_size': list(original.size),
                  'size': list(sample.size),
                  'transformation': 'RGBA PNG; fit within %d pixels with LANCZOS, no upscaling' % limit,
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'base64': base64.b64encode(raw).decode('ascii'),
              })
              notice(f'TVLok icon resource {index}', payload)
          PY
      - name: Keep the static inspection receipt (not the APK)
        uses: actions/upload-artifact@v7
        with:
          name: tvlok-static-icon-evidence
          path: build/icon-source/tvlok/
          retention-days: 7
          if-no-files-found: error
