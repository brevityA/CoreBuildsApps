name: Device check

# The one gap the build workflow cannot close.
#
# `build.yml` proves the APK compiles and packages correctly. It says nothing
# about whether the pack installs, whether a launcher can discover it, or
# whether the drawables resolve at runtime — and drawables here resolve BY NAME
# via getIdentifier(), which is precisely the path that fails silently. A
# missing drawable renders a blank tile; nothing throws.
#
# So this boots an Android TV emulator and asserts against a running system.
# Split from build.yml on purpose: an emulator job runs in minutes, not
# seconds, and the fast feedback loop on catalog edits should stay fast.
#
# Requires KVM, which GitHub's ubuntu-latest runners expose and most
# containers do not — that is why this cannot be run locally.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/device-check.yml'

permissions:
  contents: read

jobs:
  emulator:
    name: Install and launch on Android TV
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        # ubuntu-latest ships /dev/kvm but not with permissions the emulator
        # can use. Without this the emulator falls back to software rendering
        # and effectively never boots.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        # Debug, not release: an unsigned release APK cannot be installed at
        # all, and signing here would mean putting the release key on a PR
        # runner. Debug exercises the same resources and the same by-name
        # lookup.
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare emulator test script
        # The emulator-runner action (v2) executes each line of its `script:`
        # parameter as a separate `sh -c` call, so shell variables set on one
        # line are lost by the next. Writing the test to a file and invoking
        # it as one bash process avoids that.
        run: |
          cat > "$RUNNER_TEMP/device-check.sh" << 'DEVICE_CHECK'
          #!/usr/bin/env bash
          set -eu
          PKG=tv.corebuilds.iconpack
          ACT=$PKG/.MainActivity
          APK=app/build/outputs/apk/debug/app-debug.apk

          echo "::group::Install"
          adb install -r "$APK"
          if ! adb shell pm list packages | grep -q "package:$PKG"; then
            echo "::error::$PKG is not present after install — the APK did not install."
            exit 1
          fi
          echo "Installed $PKG"
          echo "::endgroup::"

          echo "::group::Launcher discovery"
          # The whole point of an icon pack: a launcher finds it by intent.
          # Projectivy scans the ADW and Nova actions.
          # `cmd package query-intent-activities` is unavailable on the
          # Android TV x86 image, so we inspect the installed package's
          # intent filters via `dumpsys package` instead.
          PKGDUMP=$(adb shell dumpsys package "$PKG")
          for ACTION in org.adw.launcher.THEMES com.novalauncher.THEME; do
            if ! echo "$PKGDUMP" | grep -q "$ACTION"; then
              echo "::error::$PKG does not declare $ACTION — no launcher would discover the pack."
              echo "$PKGDUMP" | grep -A2 "intent-filter" || true
              exit 1
            fi
            echo "$ACTION -> $PKG"
          done
          echo "::endgroup::"

          echo "::group::Launch"
          adb logcat -c
          START=$(adb shell am start -W -n "$ACT")
          echo "$START"
          if ! echo "$START" | grep -q "Status: ok"; then
            echo "::error::$ACT did not start cleanly."
            exit 1
          fi
          sleep 5
          CRASH=$(adb logcat -d -s AndroidRuntime:E | grep -E "FATAL EXCEPTION|$PKG" || true)
          if [ -n "$CRASH" ]; then
            echo "::error::$PKG crashed after launch."
            echo "$CRASH"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Runtime resource resolution"
          # MainActivity reads R.array.icon_pack — the generated list — and
          # prints its size. Asserting the rendered count proves the
          # generated string-array survived into the APK and loaded on
          # device. A stripped or stale icon_pack.xml changes this number;
          # nothing else in the pipeline would notice.
          EXPECTED=$(python3 -c "import json;print(len(json.load(open('tools/catalog.json'))['icons']))")
          adb shell uiautomator dump /sdcard/ui.xml >/dev/null
          adb pull /sdcard/ui.xml ui.xml >/dev/null
          if ! grep -q "$EXPECTED icons installed" ui.xml; then
            echo "::error::Expected the UI to report '$EXPECTED icons installed'; it did not."
            echo "Rendered text nodes:"
            grep -o 'text="[^"]*"' ui.xml | sort -u
            exit 1
          fi
          echo "UI reports $EXPECTED icons installed"
          echo "::endgroup::"

          echo "Device check passed: installed, discoverable, launched, $EXPECTED icons loaded."
          DEVICE_CHECK
          chmod +x "$RUNNER_TEMP/device-check.sh"

      - name: Boot emulator, install, and verify
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 matches the app's targetSdk. Note the arch: the android-tv
          # images are x86 (32-bit) or arm64-v8a at this level — there is no
          # android-tv x86_64 until API 36, and naming one fails the job
          # immediately with an image-not-found. Verified against
          # `sdkmanager --list`.
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ${{ runner.temp }}/device-check.sh

      - name: Upload UI dump on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-dump
          path: ui.xml
          if-no-files-found: ignore
