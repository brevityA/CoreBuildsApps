name: Device check

# The one gap the build workflow cannot close.
#
# `build.yml` proves the APK compiles and packages correctly. It says nothing
# about whether the pack installs, whether a launcher can discover it, or
# whether the drawables resolve at runtime — and drawables here resolve BY NAME
# via getIdentifier(), which is precisely the path that fails silently. A
# missing drawable renders a blank tile; nothing throws.
#
# So this boots an Android TV emulator and asserts against a running system.
# Split from build.yml on purpose: an emulator job runs in minutes, not
# seconds, and the fast feedback loop on catalog edits should stay fast.
#
# Both packs are installed, together, in that order. That is not thoroughness
# for its own sake: :app and :pop compile the same source and declare the same
# FileProvider, so if their authorities ever collide the SECOND install fails
# with INSTALL_FAILED_CONFLICTING_PROVIDER. That is an install-time failure —
# it cannot be caught by compiling, linting, or unit tests, and it would ship.
# The per-pack BuildConfig authority exists to prevent it; this is where that
# claim is actually executed rather than asserted.
#
# Requires KVM, which GitHub's ubuntu-latest runners expose and most
# containers do not — that is why this cannot be run locally.

on:
  # Temporary source-fetch trigger; removed after the APK has been inspected.
  push:
    branches: ['arena/01a07f7b-corebuildsapps']
    paths: ['.github/workflows/device-check.yml']
  workflow_dispatch:
    inputs:
      inspect_nobuffr:
        description: 'Download NoBuffr for static icon/mapping inspection (skip emulator)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'app/**'
      - 'pop/**'
      - 'tools/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/device-check.yml'

permissions:
  contents: read

jobs:
  # Some contributor networks cannot reach the vendor's download host. Keep
  # this opt-in and separate from the emulator: third-party APKs are downloaded
  # as research inputs only, never installed/executed or bundled in our packs.
  nobuffr-source:
    name: Download NoBuffr source APK (no execution)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.inspect_nobuffr)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the vendor APK
        run: |
          mkdir -p source-apk
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --max-time 180 --retry 2 \
            'https://downloads.nobuffr.com/android/nobuffr.apk' \
            --output source-apk/nobuffr.apk
          cd source-apk
          sha256sum nobuffr.apk | tee SHA256SUMS
          unzip -t nobuffr.apk >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: nobuffr-source-apk
          path: source-apk/
          retention-days: 1
          if-no-files-found: error

  emulator:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.inspect_nobuffr)
    name: Install and launch on Android TV
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Check suite truth
        run: python tools/check_suite_truth.py

      - name: Enable KVM
        # ubuntu-latest ships /dev/kvm but not with permissions the emulator
        # can use. Without this the emulator falls back to software rendering
        # and effectively never boots.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        # Debug, not release: an unsigned release APK cannot be installed at
        # all, and signing here would mean putting the release key on a PR
        # runner. Debug exercises the same resources and the same by-name
        # lookup.
        run: ./gradlew :app:assembleDebug :pop:assembleDebug --no-daemon

      - name: Prepare emulator test script
        # The emulator-runner action (v2) executes each line of its `script:`
        # parameter as a separate `sh -c` call, so shell variables set on one
        # line are lost by the next. Writing the test to a file and invoking
        # it as one bash process avoids that.
        run: |
          cat > "$RUNNER_TEMP/device-check.sh" << 'DEVICE_CHECK'
          #!/usr/bin/env bash
          set -eu

          CLASSIC_PKG=tv.corebuilds.iconpack
          POP_PKG=tv.corebuilds.iconpack.pop
          # Both manifests declare `.MainActivity`, which the manifest merger
          # resolves against the *namespace* — and both modules share the
          # namespace tv.corebuilds.iconpack, because :pop compiles :app's
          # Kotlin. `am start -n pkg/.Class` expands the shorthand against the
          # *applicationId* instead, so Pop must be launched fully qualified or
          # the launch silently targets tv.corebuilds.iconpack.pop.MainActivity,
          # which does not exist.
          CLASSIC_ACT="$CLASSIC_PKG/.MainActivity"
          POP_ACT="$POP_PKG/tv.corebuilds.iconpack.MainActivity"

          # Sets APK_PATH rather than echoing it. A function that returns its
          # value on stdout has to be called in $( ), and then its error text
          # is captured instead of printed and its `exit 1` only kills the
          # subshell — the script sails on with a garbage path and fails later
          # with no message. Assigning a global keeps the failure loud.
          resolve_apk() {
            APK_PATH=$(ls "$1"/*.apk 2>/dev/null | head -1 || true)
            if [ -z "$APK_PATH" ]; then
              echo "::error::No $2 APK found in $1 — did :$2:assembleDebug run?"
              exit 1
            fi
          }
          resolve_apk app/build/outputs/apk/debug app
          CLASSIC_APK="$APK_PATH"
          resolve_apk pop/build/outputs/apk/debug pop
          POP_APK="$APK_PATH"

          EXPECTED=$(python3 -c "import json;print(len(json.load(open('tools/catalog.json'))['icons']))")

          echo "::group::Install both packs side by side"
          # Order matters. The second install is the one that would fail if the
          # two packs ever shared a FileProvider authority.
          for SPEC in "classic:$CLASSIC_PKG:$CLASSIC_APK" "Pop:$POP_PKG:$POP_APK"; do
            LABEL=${SPEC%%:*}; REST=${SPEC#*:}; PKG=${REST%%:*}; APK=${REST#*:}
            echo "Installing $LABEL ($PKG) from $APK"
            if ! OUT=$(adb install -r "$APK" 2>&1); then
              echo "$OUT"
              case "$OUT" in
                *CONFLICTING_PROVIDER*)
                  echo "::error::$LABEL hit INSTALL_FAILED_CONFLICTING_PROVIDER — the two packs are declaring the same FileProvider authority. Check UPDATE_AUTHORITY in each module's build.gradle.kts against its AndroidManifest."
                  ;;
                *)
                  echo "::error::$LABEL failed to install."
                  ;;
              esac
              exit 1
            fi
          done

          INSTALLED=$(adb shell pm list packages)
          for PKG in "$CLASSIC_PKG" "$POP_PKG"; do
            if ! echo "$INSTALLED" | grep -q "package:$PKG$"; then
              echo "::error::$PKG is not present after install."
              echo "$INSTALLED" | grep corebuilds || true
              exit 1
            fi
          done
          echo "Both packs installed and coexisting."
          adb shell dumpsys package providers | grep -i "corebuilds" || true
          echo "::endgroup::"

          check_pack() {
            local LABEL="$1" PKG="$2" ACT="$3"

            echo "::group::$LABEL — launcher discovery"
            # The whole point of an icon pack: a launcher finds it by intent.
            # Projectivy scans the ADW and Nova actions.
            # `cmd package query-intent-activities` is unavailable on the
            # Android TV x86 image, so we inspect the installed package's
            # intent filters via `dumpsys package` instead.
            local PKGDUMP ACTION
            PKGDUMP=$(adb shell dumpsys package "$PKG")
            for ACTION in org.adw.launcher.THEMES com.novalauncher.THEME \
                          com.spocky.projengmenu.APPLY_ICONPACK; do
              if ! echo "$PKGDUMP" | grep -q "$ACTION"; then
                echo "::error::$PKG does not declare $ACTION — no launcher would discover the pack."
                echo "$PKGDUMP" | grep -A2 "intent-filter" || true
                exit 1
              fi
              echo "$ACTION -> $PKG"
            done
            echo "::endgroup::"

            echo "::group::$LABEL — launch"
            adb logcat -c
            local START CRASH
            START=$(adb shell am start -W -n "$ACT" 2>&1) || true
            echo "$START"
            # `am start` reports Status: ok even when it resolved nothing on
            # some images, so treat an explicit error line as fatal too.
            if echo "$START" | grep -qiE "Error type|does not exist|Activity class .* does not exist"; then
              echo "::error::$ACT could not be resolved. For Pop this usually means the activity was named relative to the applicationId instead of the namespace."
              exit 1
            fi
            if echo "$START" | grep -q "Status: ok"; then
              echo "Activity started normally."
            elif echo "$START" | grep -q "Status: timeout"; then
              echo "::warning::Activity start exceeded the 10 s am-start-W window — giving it 20 s extra on the emulator."
              sleep 20
            else
              echo "::error::$ACT did not start at all."
              exit 1
            fi
            sleep 5
            CRASH=$(adb logcat -d -s AndroidRuntime:E | grep -E "FATAL EXCEPTION|$PKG" || true)
            if [ -n "$CRASH" ]; then
              echo "::error::$PKG crashed after launch."
              echo "$CRASH"
              exit 1
            fi
            echo "::endgroup::"

            echo "::group::$LABEL — runtime resource resolution"
            # MainActivity reads R.array.icon_pack — the generated list — and
            # prints its size. Asserting the rendered count proves the
            # generated string-array survived into the APK and loaded on
            # device. A stripped or stale icon_pack.xml changes this number;
            # nothing else in the pipeline would notice. Both packs render the
            # same catalog, so both must report the same count.
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null
            adb pull /sdcard/ui.xml "ui-$PKG.xml" >/dev/null
            if ! grep -q "$EXPECTED icons installed" "ui-$PKG.xml"; then
              echo "::error::[$LABEL] Expected the UI to report '$EXPECTED icons installed'; it did not."
              echo "Rendered text nodes:"
              grep -o 'text="[^"]*"' "ui-$PKG.xml" | sort -u
              exit 1
            fi
            echo "$LABEL UI reports $EXPECTED icons installed"
            echo "::endgroup::"
          }

          check_pack "Icon Pack" "$CLASSIC_PKG" "$CLASSIC_ACT"
          check_pack "Pop" "$POP_PKG" "$POP_ACT"

          echo "Device check passed: both packs installed side by side, discoverable, launched, $EXPECTED icons loaded each."
          DEVICE_CHECK
          chmod +x "$RUNNER_TEMP/device-check.sh"

      - name: Boot emulator, install, and verify
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 matches the app's targetSdk. Note the arch: the android-tv
          # images are x86 (32-bit) or arm64-v8a at this level — there is no
          # android-tv x86_64 until API 36, and naming one fails the job
          # immediately with an image-not-found. Verified against
          # `sdkmanager --list`.
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ${{ runner.temp }}/device-check.sh

      - name: Upload UI dump on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-dump
          path: ui-*.xml
          if-no-files-found: ignore
