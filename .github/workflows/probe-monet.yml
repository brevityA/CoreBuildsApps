name: Probe Monet manifest

# Temporary research job: dumps the public Monet Launcher APK manifest so we
# can see which intents it actually accepts (apply icon pack, share-to-set
# wallpaper). Results are committed to the research branch as a text file.

on:
  push:
    branches: ['arena/01a095ef-corebuildsapps']
    paths: ['.github/workflows/probe-monet.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Monet release tag (e.g. v1.0.84)
        default: v1.0.84

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        run: |
          V="${{ github.event.inputs.version || 'v1.0.84' }}"
          echo "V=$V" >> "$GITHUB_ENV"
          curl -sSL -o /tmp/monet.apk "https://github.com/Klevico/Monet-Launcher/releases/download/${V}/monet-${V#v}.apk"
          ls -la /tmp/monet.apk
      - name: Dump manifest and strings
        run: |
          set -e
          mkdir -p docs/research/monet-probe
          OUT=docs/research/monet-probe/monet-${V}-manifest.txt
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "=====BADGING====="
            "$BT/aapt" dump badging /tmp/monet.apk | grep -v "^application-icon\|^locales\|^densities" || true
            echo "=====MANIFEST====="
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml /tmp/monet.apk
          } > "$OUT"
          python3 - <<'EOF' > docs/research/monet-probe/monet-${V}-dex-strings.txt
          import re, zipfile
          z = zipfile.ZipFile("/tmp/monet.apk")
          names = [n for n in z.namelist() if n.endswith(".dex")]
          pat = re.compile(rb'[\x20-\x7e]{6,240}')
          keys = ("iconpack", "icon_pack", "icon pack", "wallpaper", "extra.", ".action.",
                  "apply", "com.klevico.monet.", "attach_data", "action_send", "pictures",
                  "adw.launcher", "novalauncher", "lawnchair", "gau.go", "anddoes", "fede",
                  "themes", "appfilter", "drawable.xml", "iconback", "iconmask", "iconupon",
                  "content://", "deeplink", "monet://", "shortcut", "settings")
          hits = set()
          for n in names:
              data = z.read(n)
              for m in pat.finditer(data):
                  s = m.group().decode()
                  ls = s.lower()
                  if any(k in ls for k in keys):
                      hits.add(s)
          for s in sorted(hits):
              print(s)
          print("=====END=====", len(hits))
          EOF
          {
            echo "=====ASSETS====="
            unzip -l /tmp/monet.apk | awk '{print $4}' | grep -v "^res/\|^META-INF\|^kotlin/\|\.dex$\|^lib/" | sort
            echo "=====RES/XML====="
            unzip -l /tmp/monet.apk | awk '{print $4}' | grep "^res/xml" | sort
          } > docs/research/monet-probe/monet-${V}-files.txt
          wc -l docs/research/monet-probe/*
      - name: Decompile relevant classes
        run: |
          pip install --quiet androguard
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump strings /tmp/monet.apk 2>/dev/null \
            | grep -i -E "icon pack|iconpack|icon shape|wallpaper|folder|share|premium|rotation|library|apply|your own|image" \
            | sed -E 's/^ *String #[0-9]+ : //' | sort -u > docs/research/monet-probe/monet-${V}-res-strings.txt || true
          python3 - <<'EOF' > docs/research/monet-probe/monet-${V}-classes.txt 2>/dev/null
          import re, logging
          logging.disable(logging.CRITICAL)
          from androguard.misc import AnalyzeAPK
          a, ds, dx = AnalyzeAPK("/tmp/monet.apk")
          want = re.compile(r"WallpaperShare|IconPack|iconPack|WallpaperFolder|WallpaperRotationSource|ScreensaverWallpaperSource|ProjectivyWallpaper|Projectivy", re.I)
          seen = 0
          for cls in dx.get_classes():
              name = cls.name
              if not name.startswith("Lcom/klevico/"):
                  continue
              if not want.search(name):
                  continue
              seen += 1
              print("=" * 100)
              print("CLASS", name, "extends", cls.extends)
              try:
                  c = cls.get_vm_class()
                  for f in c.get_fields():
                      print("  FIELD", f.get_name(), f.get_descriptor(), f.get_access_flags_string())
              except Exception as e:
                  print("  (fields err)", e)
              for m in cls.get_methods():
                  print("  METHOD", m.name, m.descriptor)
                  strings = set()
                  calls = []
                  try:
                      for _, call, _ in m.get_xref_to():
                          cn = call.class_name
                          if cn.startswith("Lcom/klevico/") or cn.startswith("Landroid/") or cn.startswith("Ltv/projectivy") or cn.startswith("Landroidx/core/content/") or cn.startswith("Landroidx/documentfile"):
                              calls.append(f"{cn}->{call.name}{call.descriptor}")
                  except Exception:
                      pass
                  try:
                      mm = m.get_method()
                      if hasattr(mm, "get_instructions"):
                          for ins in mm.get_instructions():
                              out = ins.get_output()
                              if "const-string" in ins.get_name():
                                  strings.add(out.split(", ", 1)[1] if ", " in out else out)
                  except Exception:
                      pass
                  for s_ in sorted(strings):
                      print("     STR", s_)
                  for c_ in sorted(set(calls)):
                      print("     CALL", c_)
              if seen > 80:
                  break
          print("TOTAL CLASSES", seen)
          # enum values for anything IconPack / WallpaperRotationSource / ScreensaverWallpaperSource
          print("=" * 100)
          print("ENUM-LIKE FIELDS")
          for cls in dx.get_classes():
              n = cls.name
              if n.startswith("Lcom/klevico/") and re.search(r"IconPack(Mode|Variant)|WallpaperRotationSource|ScreensaverWallpaperSource|WallpaperSource|IconShape|TileStyle", n):
                  try:
                      c = cls.get_vm_class()
                      print(n, [f.get_name() for f in c.get_fields() if "static" in f.get_access_flags_string()])
                  except Exception as e:
                      print(n, "err", e)
          EOF
          wc -l docs/research/monet-probe/*
      - name: Deep pass (icon pack parsing, settings labels)
        run: |
          python3 - <<'EOF' > docs/research/monet-probe/monet-${V}-deep.txt 2>/dev/null
          import re, logging
          logging.disable(logging.CRITICAL)
          from androguard.misc import AnalyzeAPK
          a, ds, dx = AnalyzeAPK("/tmp/monet.apk")

          # 1. Default-locale English strings, all of them (for settings labels).
          print("=====DEFAULT STRINGS=====")
          res = a.get_android_resources()
          pkg = a.get_package()
          try:
              for locale, d in res.get_resolved_strings()[pkg]["string"].items():
                  if locale in ("DEFAULT", "\x00\x00"):
                      for k, v in sorted(d.items()):
                          print(f"{k} = {v}")
          except Exception as e:
              print("resolved_strings err", e)
              try:
                  for k, v in sorted(res.get_string_resources(pkg).items()):
                      print(f"{k} = {v}")
              except Exception as e2:
                  print("fallback err", e2)

          # 2. Every method whose const-strings mention icon-pack parsing / share / folders.
          print("=====ICON PACK METHODS=====")
          want = re.compile(r"appfilter|drawable\.xml|iconback|iconmask|iconupon|_banner|iconPackVariant|iconPackRenderPx|icon_pack|org\.adw\.launcher\.THEMES|com\.novalauncher\.THEME|ComponentInfo|Unable to get icon package|wallpaper_folder|addWallpaperFolder|EXTRA_STREAM|extra\.STREAM|image/|Pictures", re.I)
          shown = 0
          for m in dx.get_methods():
              if m.is_external():
                  continue
              try:
                  mm = m.get_method()
                  strs = []
                  for ins in mm.get_instructions():
                      if "const-string" in ins.get_name():
                          out = ins.get_output()
                          strs.append(out.split(", ", 1)[1] if ", " in out else out)
              except Exception:
                  continue
              joined = "\n".join(strs)
              if not want.search(joined):
                  continue
              shown += 1
              print("-" * 90)
              print("METHOD", m.class_name, m.name, m.descriptor)
              for s_ in strs:
                  print("   STR", s_)
              calls = set()
              try:
                  for _, call, _ in m.get_xref_to():
                      cn = call.class_name
                      if cn.startswith(("Landroid/", "Lcom/klevico/", "Lorg/xmlpull/", "Landroidx/documentfile/", "Landroidx/core/content/")):
                          calls.add(f"{cn}->{call.name}{call.descriptor}")
              except Exception:
                  pass
              for c_ in sorted(calls):
                  print("   CALL", c_)
              if shown > 60:
                  break
          print("TOTAL METHODS", shown)

          # 3. Enum-ish classes under com.klevico.monet.model.LauncherPreferences$*
          print("=====PREF ENUMS=====")
          for cls in dx.get_classes():
              n = cls.name
              if "LauncherPreferences$" in n or re.search(r"IconPack|IconShape|TileStyle|WallpaperSource|RotationSource", n):
                  try:
                      c = cls.get_vm_class()
                      names = [f.get_name() for f in c.get_fields() if "static" in f.get_access_flags_string() and "final" in f.get_access_flags_string() and f.get_descriptor() == n]
                      if names:
                          print(n, names)
                  except Exception:
                      pass
          EOF
          wc -l docs/research/monet-probe/*
      - name: Bytecode dump (share activity + icon pack loader)
        run: |
          python3 - <<'EOF' > docs/research/monet-probe/monet-${V}-bytecode.txt 2>/dev/null
          import re, logging
          logging.disable(logging.CRITICAL)
          from androguard.misc import AnalyzeAPK
          a, ds, dx = AnalyzeAPK("/tmp/monet.apk")
          res = a.get_android_resources()
          pkg = a.get_package()
          def resname(rid):
              try:
                  return res.get_resource_xml_name(rid, pkg)
              except Exception:
                  return None
          def resstr(rid):
              try:
                  return res.get_string(pkg, resname(rid).split('/')[-1])[1]
              except Exception:
                  return None
          targets = {"Lcom/klevico/monet/WallpaperShareActivity;", "La/wj1;", "La/vj1;", "La/nu1;", "La/tj1;"}
          # also any class with a field named iconPackVariant / IconPackVariant enum
          for cls in dx.get_classes():
              n = cls.name
              if re.search(r"IconPackVariant|IconPackMode|WallpaperRotationSource|ScreensaverWallpaperSource", n):
                  targets.add(n)
          for cls in dx.get_classes():
              if cls.name not in targets:
                  continue
              print("=" * 100)
              print("CLASS", cls.name, "extends", cls.extends)
              try:
                  c = cls.get_vm_class()
                  for f in c.get_fields():
                      print("  FIELD", f.get_access_flags_string(), f.get_descriptor(), f.get_name())
              except Exception:
                  pass
              for m in cls.get_methods():
                  if m.is_external():
                      continue
                  print("  METHOD", m.name, m.descriptor)
                  try:
                      mm = m.get_method()
                      for ins in mm.get_instructions():
                          name = ins.get_name(); out = ins.get_output()
                          if name.startswith(("const-string", "invoke", "const/4", "const/16", "const ", "if-", "new-instance", "sget-object", "iget-object", "return", "check-cast", "const/high16", "const-class")):
                              line = f"      {name} {out}"
                              mres = re.search(r"0x7f[0-9a-f]{6}", out)
                              if mres:
                                  rid = int(mres.group(), 16)
                                  line += f"   ; {resname(rid)} = {resstr(rid)!r}"
                              print(line[:400])
                  except Exception as e:
                      print("      (err)", e)
          EOF
          wc -l docs/research/monet-probe/*
      - name: Final pass (english strings, share coroutine, folder enumeration)
        run: |
          python3 - <<'EOF' > docs/research/monet-probe/monet-${V}-final.txt 2>/dev/null
          import re, logging
          logging.disable(logging.CRITICAL)
          from androguard.misc import AnalyzeAPK
          a, ds, dx = AnalyzeAPK("/tmp/monet.apk")
          res = a.get_android_resources()
          pkg = a.get_package()
          print("=====ENGLISH STRINGS (default locale)=====")
          try:
              xml = res.get_string_resources(pkg, locale='\x00\x00')
              if isinstance(xml, bytes): xml = xml.decode("utf-8", "replace")
              for m in re.finditer(r'<string name="([^"]+)">(.*?)</string>', xml, re.S):
                  print(f"{m.group(1)} = {m.group(2)}")
          except Exception as e:
              print("err", e)
          def resname(rid):
              try: return res.get_resource_xml_name(rid, pkg)
              except Exception: return None
          def dump(cls):
              print("=" * 100)
              print("CLASS", cls.name, "extends", cls.extends)
              try:
                  for f in cls.get_vm_class().get_fields():
                      print("  FIELD", f.get_access_flags_string(), f.get_descriptor(), f.get_name())
              except Exception: pass
              for m in cls.get_methods():
                  if m.is_external(): continue
                  print("  METHOD", m.name, m.descriptor)
                  try:
                      for ins in m.get_method().get_instructions():
                          name = ins.get_name(); out = ins.get_output()
                          if name.startswith(("const", "invoke", "if-", "new-instance", "sget", "iget", "iput", "sput", "return", "check-cast")):
                              line = f"      {name} {out}"
                              mres = re.search(r"\b(2130\d{6}|2131\d{6}|2132\d{6}|2133\d{6}|0x7f[0-9a-f]{6})\b", out)
                              if mres:
                                  v = mres.group(1); rid = int(v, 16) if v.startswith("0x") else int(v)
                                  line += f"   ; {resname(rid)}"
                              print(line[:400])
                  except Exception as e:
                      print("      (err)", e)
          targets = {"La/qr2;", "La/mq4;", "La/ax0;", "Lcom/klevico/monet/WallpaperShareActivity;"}
          # classes mentioning bucket_display_name or wallpaper_folder_uris / addWallpaperFolder
          for m in dx.get_methods():
              if m.is_external(): continue
              try:
                  strs = " ".join(ins.get_output() for ins in m.get_method().get_instructions() if "const-string" in ins.get_name())
              except Exception: continue
              if re.search(r"bucket_display_name|bucket_id|Could not address wallpaper folder|DocumentsProvider returned no wallpaper folder|MediaStore returned no cursor for wallpaper folder|Blank wallpaper folder URI", strs):
                  targets.add(m.class_name)
          for cls in dx.get_classes():
              if cls.name in targets:
                  dump(cls)
          EOF
          wc -l docs/research/monet-probe/*
      - name: Variant pass (iconPackVariant semantics)
        run: |
          python3 - <<'EOF' > docs/research/monet-probe/monet-${V}-variant.txt 2>&1 || true
          import re, logging, traceback
          logging.disable(logging.CRITICAL)
          from androguard.misc import AnalyzeAPK
          a, ds, dx = AnalyzeAPK("/tmp/monet.apk")
          res = a.get_android_resources(); pkg = a.get_package()
          def resname(rid):
              try: return res.get_resource_xml_name(rid, pkg)
              except Exception: return None
          # 1. all dex strings containing banner / variant / wide / landscape / 16:9
          print("=====STRINGS=====")
          seen=set()
          for d in ds:
              for st in d.get_strings():
                  v = str(st)
                  if re.search(r"banner|variant|wide|landscape|16:9|_round|_square|iconPackRenderPx|render_px|_tv$|leanback", v, re.I) and len(v) < 200:
                      if v not in seen:
                          seen.add(v); print(v)
          # 2. classes with a field named iconPackVariant, and enum classes whose values look like variants
          print("=====CLASSES WITH iconPackVariant FIELD=====")
          targets=set()
          import sys
          sys.excepthook = lambda *a: traceback.print_exception(*a)
          for cls in dx.get_classes():
              try:
                  c = cls.get_vm_class()
              except Exception:
                  continue
              names = [f.get_name() for f in c.get_fields()]
              if "iconPackVariant" in names or "iconPackRenderPx" in names:
                  print(cls.name, [(f.get_name(), f.get_descriptor()) for f in c.get_fields() if "icon" in f.get_name().lower()])
                  for f in c.get_fields():
                      if f.get_name() == "iconPackVariant":
                          targets.add(f.get_descriptor())
          print("=====VARIANT TYPES=====", targets)
          for cls in dx.get_classes():
              if cls.name in targets:
                  print("=" * 80); print("CLASS", cls.name, "extends", cls.extends)
                  try:
                      for f in cls.get_vm_class().get_fields():
                          print("  FIELD", f.get_access_flags_string(), f.get_descriptor(), f.get_name())
                  except Exception: pass
                  for m in cls.get_methods():
                      if m.is_external(): continue
                      print("  METHOD", m.name, m.descriptor)
                      try:
                          for ins in m.get_method().get_instructions():
                              if ins.get_name().startswith(("const-string", "sput", "new-instance", "invoke")):
                                  print("      ", ins.get_name(), ins.get_output()[:200])
                      except Exception: pass
          # 3. methods that read iconPackVariant and use a suffix / getIdentifier
          print("=====METHODS USING iconPackVariant=====")
          n=0
          for m in dx.get_methods():
              if m.is_external(): continue
              try:
                  ins_list = list(m.get_method().get_instructions())
              except Exception: continue
              txt = "\n".join(f"{i.get_name()} {i.get_output()}" for i in ins_list)
              if "iconPackVariant" in txt and ("getIdentifier" in txt or "const-string" in txt):
                  n+=1
                  print("-"*80); print("METHOD", m.class_name, m.name, m.descriptor)
                  for l in txt.splitlines():
                      if re.search(r"const-string|getIdentifier|iconPackVariant|iconPackRenderPx|append|_banner|toLowerCase|concat", l):
                          print("   ", l[:220])
                  if n > 12: break
          # 4. the method that builds the drawable name list (wj1.j callers)
          print("=====CALLERS OF wj1.j (bitmap loader)=====")
          for cls in dx.get_classes():
              if cls.name == "La/wj1;":
                  for m in cls.get_methods():
                      if m.name == "j":
                          for _, caller, _ in m.get_xref_from():
                              print("  ", caller.class_name, caller.name, caller.descriptor)
                              try:
                                  for i in caller.get_method().get_instructions():
                                      if i.get_name().startswith("const-string") or "append" in i.get_output() or "iconPack" in i.get_output():
                                          print("        ", i.get_name(), i.get_output()[:200])
                              except Exception: pass
          EOF
          wc -l docs/research/monet-probe/*
      - name: Commit results
        run: |
          git config user.name "monet-probe"
          git config user.email "monet-probe@users.noreply.github.com"
          git add docs/research/monet-probe
          git commit -m "research: Monet ${V} manifest probe output [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
