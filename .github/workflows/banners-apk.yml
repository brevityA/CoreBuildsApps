name: Core Builds Banners APK

# Builds Core Builds Banners (banners/) — the 16:9 banner card icon pack variant.
#
# Banners shares tools/catalog.json and the Kotlin in app/src/main/java with the
# classic pack, and shares the root Gradle build as the :banners module. What it
# does not share is its package ID, its release tag, or its update manifest,
# so shipping one pack never moves the other.
#
# CI:      push/PR touching banners/, tools/, or app/ sources → regenerate, diff, build
# Release: push a banners-v* tag → signed release APK → GitHub Release + floating `banners` tag
#
# Tag prefix is "banners-v" so it never collides with the icon pack's v* tags,
# Pop's pop-v*, Core Line's coreline-v*, Core Shift's shift-v*, or Core Motion's motion-v*.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'banners/**'
      - 'tools/build_banner_pack.py'
      - 'tools/validate_banners.py'
      - 'tools/catalog.json'
      - 'tools/glyphs.py'
      - 'app/src/main/java/**'
      - 'app/src/main/res/layout/**'
      - 'app/src/main/res/values/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'Latestrelease/banners-version.json'
      - 'settings.gradle.kts'
      - '.github/workflows/banners-apk.yml'
  push:
    branches: [main]
    tags: ['banners-v*']

permissions:
  contents: write

jobs:
  assets:
    name: Regenerate and validate Banners assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check suite truth
        run: python tools/check_suite_truth.py

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install render deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2
          pip install --quiet -r tools/requirements.txt

      - name: Regenerate Banners from the catalog
        run: python tools/build_banner_pack.py

      - name: Verify committed assets match the catalog
        run: |
          DRIFT=$(git status --porcelain -- '*.xml' '*.md' | grep -v '^?? ' || true)
          if [ -n "$DRIFT" ]; then
            echo "::error::Generated Banners files differ from committed ones."
            echo "Run: python tools/build_banner_pack.py"
            echo "$DRIFT"
            git --no-pager diff -- '*.xml' '*.md'
            exit 1
          fi
          echo "Text assets verified in sync with tools/catalog.json"

      - name: Validate Banners
        run: python tools/validate_banners.py

  apk:
    name: Assemble APK
    needs: assets
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Check suite truth
        run: python tools/check_suite_truth.py

      - name: Refuse to build a tag that is not on main
        if: startsWith(github.ref, 'refs/tags/banners-v')
        run: |
          git fetch origin main --depth=50
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not an ancestor of main"; exit 1; }
          TAG="${GITHUB_REF_NAME#banners-v}"
          GRADLE=$(grep -oP 'versionName = "\K[^"]+' banners/build.gradle.kts)
          [ "$TAG" = "$GRADLE" ] \
            || { echo "::error::tag $TAG != versionName $GRADLE"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Keystore decoded — release will be signed."

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :banners:assembleRelease --no-daemon

      - name: Verify the APK is signed before releasing
        if: startsWith(github.ref, 'refs/tags/banners-v')
        run: |
          APK=$(ls banners/build/outputs/apk/release/*.apk)
          echo "Verifying $APK"
          case "$APK" in
            *-unsigned.apk)
              echo "::error::$APK is unsigned — a tagged release must be installable."
              echo "KEYSTORE_BASE64 is unset or failed to decode. See PUBLISHING.md step 4."
              exit 1
              ;;
          esac
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          echo "APK signature verified."

      - name: Name the APK for the stable Downloader URL
        if: startsWith(github.ref, 'refs/tags/banners-v')
        run: |
          SRC=$(ls banners/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          mkdir -p dist
          cp "$SRC" dist/corebanners-release.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: core-builds-banners
          path: banners/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Sync the update manifest to the published tag
        if: startsWith(github.ref, 'refs/tags/banners-v')
        run: |
          TAG="${GITHUB_REF_NAME#banners-v}"
          python - "$TAG" <<'PY'
          import json, re, sys
          tag = sys.argv[1]
          gradle = open('banners/build.gradle.kts').read()
          code = int(re.search(r'versionCode\s*=\s*(\d+)', gradle).group(1))
          p = 'Latestrelease/banners-version.json'
          d = json.load(open(p))
          d['versionCode'] = code
          d['versionName'] = tag
          json.dump(d, open(p, 'w'), indent=2)
          open(p, 'a').write('\n')
          print(f'banners-version.json -> {tag} / {code}')
          PY
          if ! git diff --quiet -- Latestrelease/banners-version.json; then
            cp Latestrelease/banners-version.json /tmp/banners-version.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git fetch origin main --depth=50
            git checkout -B _banners-version-sync origin/main
            cp /tmp/banners-version.json Latestrelease/banners-version.json
            git add Latestrelease/banners-version.json
            git commit -m "chore: sync Banners update manifest to ${GITHUB_REF_NAME}"
            git push origin _banners-version-sync:main
          fi

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/banners-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --draft --generate-notes --verify-tag \
            dist/corebanners-release.apk
          gh release edit "$TAG" --draft=false --latest=false

      - name: Point floating tag banners at this commit
        if: startsWith(github.ref, 'refs/tags/banners-v')
        run: |
          git tag -f banners "$GITHUB_SHA"
          git push -f origin refs/tags/banners

      - name: Publish stable Downloader release
        if: startsWith(github.ref, 'refs/tags/banners-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete banners --yes 2>/dev/null || true
          gh release create banners --draft \
            --title "Core Builds Banners (latest)" \
            --notes "$(cat <<'EOF'
          Always the current Core Builds Banners APK. Versioned notes live on `banners-v*` releases.

          https://github.com/brevityA/CoreBuildsApps/releases/download/banners/corebanners-release.apk
          EOF
          )" \
            dist/corebanners-release.apk
          gh release edit banners --draft=false --latest=false
