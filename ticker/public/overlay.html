<!doctype html>
<!--
  Phone floating overlay (OverlayService.kt).

  The same chyron, stripped of everything around it. It links the shared
  tokens, base and chyron layers rather than carrying its own copy of the
  strip's CSS — the two used to drift, which is how the overlay ended up with
  a different tick size and a different live red from the board.

  The window itself is translucent and touch-through; the strip carries its
  own ink so it stays legible over any app behind it.
-->
<html lang="en" data-overlay>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Core Line</title>
  <!--
    The same policy the board ships (`index.html`), for the same reasons, and
    narrower because this document is narrower: no images, no manifest, no
    service worker. It is a separate file and so needs its own copy — a CSP
    does not inherit between documents, and this one floats over whatever app
    the viewer is actually using.

    `style-src` keeps `'unsafe-inline'` for the same reason the board does
    (inline custom-property accents), and `connect-src` stays open to
    http/https because the strip renders the same slate as the board, from
    the same user-supplied feeds.

    `default-src 'none'` means this document can load nothing that is not
    named below — if the crawl ever grows a team logo it will be blocked
    until someone adds the host here on purpose, which is the intended
    conversation.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' http: https:">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/chyron.css">
</head>
<body>
  <div class="chyron" id="chyron">
    <div class="chyron__bug">
      <span class="bug__live" id="bugLive">CORE</span>
      <span class="bug__name">LINE</span>
    </div>
    <div class="chyron__mask" id="crawlMask">
      <div class="crawl" id="crawl">
        <div class="crawl__seq" id="crawlA"></div>
        <div class="crawl__seq" id="crawlB" aria-hidden="true"></div>
      </div>
    </div>
    <div class="chyron__clock" id="clock">00:00</div>
  </div>
  <script type="module" src="./js/overlay.js"></script>
</body>
</html>
