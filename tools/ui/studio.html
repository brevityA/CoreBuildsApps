<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Builds UI Studio — TV screen generator</title>
<style>
:root{
  --night:#0D1117; --panel:#1A2030; --card:#151923; --void:#04070F;
  --ink:#E6EDF3; --slate:#8B949E; --cyan:#00D4FF; --cta-ink:#04202B;
  --hair:rgba(255,255,255,.08); --focusScale:1.06; --itemScale:1.04; --focusMs:160ms;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--night);border-bottom:1px solid var(--hair);flex-wrap:wrap}
.logo{color:var(--cyan);font-size:22px}
h1{font-size:15px;margin:0;letter-spacing:.02em}
h1 small{display:block;color:var(--slate);font-weight:400;font-size:11px}
.hctl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--hair);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:13px}
button{cursor:pointer;border:1px solid var(--hair);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;background:var(--panel);color:var(--ink)}
button:hover{border-color:var(--cyan)}
button.primary{background:linear-gradient(180deg,#00D4FF,#00ABD3);color:var(--cta-ink);border:none}
main{display:grid;grid-template-columns:228px minmax(0,1fr) 348px;gap:12px;padding:12px;height:calc(100vh - 61px)}
.panel{background:var(--night);border:1px solid var(--hair);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.panel h2{font-size:11px;letter-spacing:.14em;color:var(--slate);margin:0;padding:10px 12px;border-bottom:1px solid var(--hair);text-transform:uppercase}
.scroll{overflow:auto;padding:10px;flex:1;min-height:0}
.palbtn{display:block;width:100%;text-align:left;margin:0 0 6px;background:var(--card)}
.palbtn b{display:block;font-size:13px}
.palbtn span{color:var(--slate);font-weight:400;font-size:11px}
/* ---------- stage ---------- */
#stageCol{display:flex;flex-direction:column;gap:10px;min-height:0}
#tv{background:#000;border:1px solid var(--hair);border-radius:12px;padding:10px;flex:1;min-height:0;display:flex}
#canvas{background:var(--night);border-radius:6px;flex:1;overflow-y:auto;padding:28px 32px;position:relative;min-height:0}
#canvas>*{max-width:980px;margin-left:auto;margin-right:auto}
.kicker{display:inline-block;font:700 10px var(--mono);letter-spacing:.18em;color:var(--cyan);border:1px solid var(--hair);border-radius:999px;padding:5px 10px}
.title{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:8px 0 0}
.count{font:12px var(--mono);color:var(--slate);margin-top:4px}
.toprow{display:flex;gap:16px;align-items:flex-start}
.toprow .grow{flex:1;min-width:0}
.sidecol{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.btn{display:inline-block;border-radius:10px;padding:10px 18px;font-weight:700;font-size:13px;border:1px solid transparent;cursor:pointer}
.btn.cta{background:linear-gradient(180deg,#00D4FF,#00ABD3);color:var(--cta-ink)}
.btn.ghost{background:transparent;border-color:var(--hair);color:var(--ink)}
.btn.chip,.btn.toggle{border-radius:999px;border-color:var(--hair);color:var(--ink);padding:10px 16px}
.btnsub{font:11px var(--mono);color:var(--slate);text-align:right}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.chips{display:flex;gap:8px;margin-top:16px;overflow:hidden}
.chip{border:1px solid var(--hair);border-radius:999px;padding:9px 15px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.chip.on{background:linear-gradient(180deg,#00D4FF,#00ABD3);color:var(--cta-ink);border:none}
.searchrow{display:flex;gap:12px;margin-top:16px;align-items:center}
.searchrow .chips{margin-top:0;flex:1}
.search{flex:0 0 300px;border:1px solid var(--hair);border-radius:10px;padding:11px 14px;color:var(--slate);font-size:12px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:14px 8px 10px;text-align:center;cursor:pointer}
.tile .g{font-size:30px;line-height:1;color:var(--cyan)}
.tile .t{font-size:11px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidebox{margin-top:14px;border:1px dashed #3a4556;border-radius:10px;color:var(--slate);font-size:12px;padding:12px;text-align:center;cursor:pointer}
.hidebox:hover{border-color:var(--cyan);color:var(--cyan)}
.ubar{margin-top:14px;background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.ubar .grow{flex:1}.ubar b{font-size:13px}.ubar small{display:block;color:var(--slate);font-size:11px}
.hero{margin-top:16px;display:flex;gap:16px;align-items:center}
.hero .art{width:150px;height:84px;border-radius:10px;background:linear-gradient(135deg,#12303c,#1A2030);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--cyan)}
.hero .hk{font:700 10px var(--mono);letter-spacing:.18em;color:var(--cyan)}
.hero .ht{font-size:19px;font-weight:800}.hero .hm{color:var(--slate);font-size:12px}
.srow{margin-top:8px;background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;display:flex;gap:10px;cursor:pointer}
.srow b{font-size:13px}.srow .grow{flex:1}.srow .v{color:var(--slate);font-size:12px}
.emptybox{margin-top:16px;text-align:center;padding:20px}
.emptybox h3{margin:0;font-size:19px}.emptybox p{color:var(--slate);font-size:12px}
.emptybox .actions{justify-content:center}
.hintline{margin-top:8px;color:var(--cyan);font-size:12px}
.selbar{margin-top:12px;display:flex;gap:10px;align-items:center}
.selbar .grow{flex:1;font:12px var(--mono);color:var(--cyan)}
/* focus sim */
.fv{transition:transform var(--focusMs) cubic-bezier(.2,.7,.3,1.2),box-shadow var(--focusMs) ease;position:relative}
.fv.focused{transform:scale(var(--focusScale));box-shadow:0 0 0 3px var(--cyan),0 0 22px rgba(0,212,255,.45);z-index:3;border-radius:10px}
.tile.fv.focused,.chip.fv.focused{transform:scale(var(--itemScale))}
.enterplay>*{animation:enter var(--enterMs,220ms) cubic-bezier(.2,.7,.3,1) backwards}
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--cyan);color:var(--ink);border-radius:999px;padding:8px 18px;font-size:12px;display:none;z-index:9}
/* below stage */
#under{display:flex;gap:10px;align-items:stretch}
#focusread{flex:1;background:var(--night);border:1px solid var(--hair);border-radius:10px;padding:8px 12px;font:12px var(--mono);color:var(--slate);min-width:0}
#focusread b{color:var(--cyan)}
#remote{background:var(--night);border:1px solid var(--hair);border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,30px);gap:3px}
#remote button{padding:0;font-size:13px;line-height:1}
#remote .ok{font-size:10px}
/* ---------- inspector ---------- */
.tabs{display:flex;border-bottom:1px solid var(--hair)}
.tabs button{flex:1;border:none;border-radius:0;background:none;color:var(--slate);font-size:12px;padding:9px 4px}
.tabs button.on{color:var(--cyan);box-shadow:inset 0 -2px var(--cyan)}
#inspBody{flex:1;min-height:0;overflow:auto;padding:10px}
.blk{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--hair);border-radius:8px;padding:7px 8px;margin-bottom:6px;cursor:pointer;font-size:12px}
.blk.sel{border-color:var(--cyan)}
.blk .t{font-weight:700}.blk .i{color:var(--slate);font-family:var(--mono);font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk button{padding:3px 7px;font-size:11px}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11px;color:var(--slate);margin-bottom:4px;letter-spacing:.04em}
.fld input[type=text],.fld input[type=number],.fld select{width:100%}
.fld input[type=range]{width:100%}
.mini{background:var(--card);border:1px solid var(--hair);border-radius:8px;padding:8px;margin-bottom:6px}
.mini input,.mini select{width:100%;margin-bottom:6px;font-size:12px;padding:6px 8px}
.mini .row{display:flex;gap:6px}.mini .row>*{flex:1}
.codebar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.codebar select{flex:1}
pre{background:var(--void);border:1px solid var(--hair);border-radius:8px;padding:10px;font:11px/1.55 var(--mono);white-space:pre;overflow:auto;max-height:52vh;margin:0}
.chk{font-size:12px;padding:7px 9px;border-radius:8px;margin-bottom:6px;border:1px solid var(--hair)}
.chk.err{border-color:#F87171}.chk.warn{border-color:#FBBF24}.chk.ok{border-color:#34D399}
.chk b{display:block;font-size:11px;letter-spacing:.06em}
#statusbar{padding:8px 12px;border-top:1px solid var(--hair);font:11px var(--mono);color:var(--slate)}
@media(max-width:1100px){main{grid-template-columns:1fr;height:auto}#stageCol{min-height:70vh}}
</style>
</head>
<body>
<header>
  <span class="logo">⬢</span>
  <h1>Core Builds UI Studio<small>TV screen generator · D-pad wiring + motion included</small></h1>
  <div class="hctl">
    <select id="presetSel" title="Starter screen"></select>
    <input type="text" id="screenName" size="12" title="Screen name (PascalCase)">
    <button id="loadSpecBtn" title="Load a spec JSON file">Load spec</button>
    <input type="file" id="specFile" accept=".json" hidden>
    <button id="specBtn" title="Download spec.json for tools/build_ui.py --spec">Export spec</button>
    <button class="primary" id="copyHint" title="Copy the --apply command">Copy --apply cmd</button>
  </div>
</header>
<main>
  <div class="panel"><h2>Blocks — click to add</h2><div class="scroll" id="palette"></div></div>
  <div id="stageCol">
    <div id="tv"><div id="canvas" tabindex="0"><div id="toast"></div></div></div>
    <div id="under">
      <div id="focusread">focus: <b>—</b></div>
      <div id="remote">
        <span></span><button data-k="up">▲</button><span></span>
        <button data-k="left">◀</button><button data-k="ok" class="ok">OK</button><button data-k="right">▶</button>
        <span></span><button data-k="down">▼</button><button data-k="back" class="ok" title="Back">⟲</button>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="tabs" id="tabs">
      <button data-t="blocks" class="on">Blocks</button>
      <button data-t="props">Props</button>
      <button data-t="anim">Motion</button>
      <button data-t="code">Code</button>
      <button data-t="checks">Checks</button>
    </div>
    <div id="inspBody"></div>
    <div id="statusbar"></div>
  </div>
</main>
<script>
'use strict';
/* ==========================================================================
   PURE MODEL + CODEGEN — no DOM here, so Node can test it (see bottom).
   Mirrors tools/ui/spec.py + render.py: same ids, same links, same strings.
   ========================================================================== */
const BLOCK_TYPES = ["header","actions","targets","updatebar","chips","search",
  "filterrow","grid","hero","settings","empty","selectionbar","hint"];
const BUTTON_STYLES = ["cta","ghost","chip","toggle"];
const GRID_SOURCES = ["icons","walls","custom"];

function snake(n){ return n.replace(/(?<!^)(?=[A-Z])/g,"_").toLowerCase().replace(/__+/g,"_"); }
function isRef(v){ return typeof v==="string" && v.startsWith("@"); }
function deep(o){ return JSON.parse(JSON.stringify(o)); }

const EMBEDDED = {
browser:{screen:"IconBrowser",blocks:[
 {type:"header",title:"Icon browser",side:[{id:"browse_apply",style:"cta",text:"Apply in Projectivy"},{id:"browse_walls",style:"ghost",text:"@string/wp_entry",go:"WallpapersActivity"}]},
 {type:"targets",id:"browse_targets"},
 {type:"updatebar",id:"browse_update",label:"Update available",sub:"A newer build of the pack is ready to download.",button:"Download"},
 {type:"filterrow",chips_id:"browse_chips",search_id:"browse_search",keys:["ALL","STREAM","MEDIA","VOD","PLAYER","LIVE","MUSIC","SPORT","TOOL","STORE","LAUNCHER","VPN","GAMING","DEBRID","BROWSER","VIDEO","FILES","SYSTEM","APP"],labels:["All","Streaming","Media","On demand","Players","Live TV","Music","Sport","Tools","Stores","Launchers","VPN","Gaming","Debrid","Browsers","Video","Files","System","Apps"]},
 {type:"empty",id:"browse_empty"},
 {type:"grid",id:"browse_grid",source:"icons"}],
 dpad:{initialFocus:"browse_apply"}},
wallpapers:{screen:"WallBrowser",blocks:[
 {type:"header",kicker:"@string/wp_kicker",title:"Wallpapers",side:[{id:"wbrowser_export",style:"cta",text:"@string/wp_export"},{id:"wbrowser_back",style:"ghost",text:"@string/wp_back"}]},
 {type:"selectionbar",id:"wbrowser_selection"},
 {type:"chips",id:"wbrowser_chips",fromCatalog:true},
 {type:"hint",text:"@string/wp_hint"},
 {type:"grid",id:"wbrowser_grid",source:"walls",cellDp:220}],
 dpad:{initialFocus:"wbrowser_export"}},
details:{screen:"Details",blocks:[
 {type:"header",title:"Details",showCount:false,side:[{id:"details_close",style:"ghost",text:"Back"}]},
 {type:"hero",kicker:"STREAMING",title:"Stremio",meta:"4 components · one accent"},
 {type:"actions",buttons:[{id:"details_apply",style:"cta",text:"Apply icon"},{id:"details_preview",style:"ghost",text:"Preview banner"}]},
 {type:"hint",text:"Banners are 320×180 for Projectivy wide cards."},
 {type:"grid",id:"details_grid",source:"custom"}],
 dpad:{initialFocus:"details_apply"}},
settings:{screen:"Settings",blocks:[
 {type:"header",title:"Settings",showCount:false},
 {type:"settings",rows:[{id:"set_theme",label:"Card style",value:"Night"},{id:"set_columns",label:"Grid columns",value:"Auto"},{id:"set_motion",label:"Animations",value:"On"},{id:"set_about",label:"About",value:"Core Builds"}]},
 {type:"actions",buttons:[{id:"set_done",style:"cta",text:"Done"}]}],
 dpad:{initialFocus:"set_theme"}},
onboarding:{screen:"Welcome",blocks:[
 {type:"header",title:"Welcome",showCount:false},
 {type:"hero",kicker:"CORE BUILDS",title:"One pack, every app",meta:"Transparent icons plus wallpapers for Projectivy."},
 {type:"actions",buttons:[{id:"welcome_apply",style:"cta",text:"Apply the pack"},{id:"welcome_browse",style:"ghost",text:"Browse icons",go:"MainActivity"}]},
 {type:"hint",text:"Works with Projectivy Launcher on Android TV."}],
 dpad:{initialFocus:"welcome_apply"},anim:{focusScale:1.08,enter:true}}
};

function blockIds(b){
  // every id a block declares (mirrors spec.py claiming)
  const t=b.type, out=[];
  if(t==="header"){ if(b.showCount!==false&&b.count_id)out.push(b.count_id);
    (b.side||[]).forEach(x=>x.id&&out.push(x.id)); }
  else if(t==="filterrow"){ b.chips_id&&out.push(b.chips_id); b.search_id&&out.push(b.search_id); }
  else if(t==="empty"){ b.id&&out.push(b.id); b.primary_id&&out.push(b.primary_id); b.secondary_id&&out.push(b.secondary_id); }
  else if(t==="updatebar"){ b.id&&out.push(b.id); b.button_id&&out.push(b.button_id); }
  else if(t==="selectionbar"){ b.id&&out.push(b.id); (b.buttons||[]).forEach(x=>x.id&&out.push(x.id)); }
  else if(t==="actions"){ (b.buttons||[]).forEach(x=>x.id&&out.push(x.id)); }
  else if(t==="settings"){ (b.rows||[]).forEach(x=>x.id&&out.push(x.id)); }
  else if(b.id) out.push(b.id);
  return out;
}
function levelGone(b, shown){
  if(b.type==="targets") return !(b.visible||shown[b.uid]);
  if(b.type==="updatebar"||b.type==="empty"||b.type==="selectionbar") return !shown[b.uid];
  return false;
}
function focusLevels(blocks, shown){
  shown = shown||{};
  const lv=[];
  blocks.forEach(b=>{
    const t=b.type, gone=levelGone(b,shown);
    if(t==="header") (b.side||[]).forEach(x=>x.id&&lv.push({anchors:[x.id],gone:false,uid:b.uid}));
    else if(t==="actions"){ const ids=(b.buttons||[]).map(x=>x.id).filter(Boolean);
      if(ids.length)lv.push({anchors:ids,gone:false,uid:b.uid}); }
    else if(t==="targets"){ if(b.id)lv.push({anchors:[b.id],gone,uid:b.uid}); }
    else if(t==="updatebar"){ if(b.button_id)lv.push({anchors:[b.button_id],gone,uid:b.uid}); }
    else if(t==="chips"||t==="search"||t==="grid"){ if(b.id)lv.push({anchors:[b.id],gone:false,uid:b.uid}); }
    else if(t==="filterrow"){ const a=[b.chips_id,b.search_id].filter(Boolean);
      if(a.length)lv.push({anchors:a,gone:false,uid:b.uid}); }
    else if(t==="settings") (b.rows||[]).forEach(r=>r.id&&lv.push({anchors:[r.id],gone:false,uid:b.uid}));
    else if(t==="empty"){ const a=[b.primary_id,b.secondary_id].filter(Boolean);
      if(a.length)lv.push({anchors:a,gone,uid:b.uid}); }
    else if(t==="selectionbar"){ const ids=(b.buttons||[]).map(x=>x.id).filter(Boolean);
      if(ids.length)lv.push({anchors:ids,gone,uid:b.uid}); }
  });
  return lv;
}
function computeLinks(blocks, shown){
  const levels=focusLevels(blocks,shown||{}), links={};
  const link=(v,d,t)=>{ (links[v]=links[v]||{})[d]=t; };
  const vis=levels.filter(l=>!l.gone);
  vis.forEach((l,i)=>{
    const up=i>0?vis[i-1].anchors[vis[i-1].anchors.length-1]:null;
    const down=i<vis.length-1?vis[i+1].anchors[0]:null;
    l.anchors.forEach(a=>{ if(up)link(a,"up",up); if(down)link(a,"down",down); });
  });
  levels.forEach((l,i)=>{
    if(!l.gone)return;
    const prev=[...levels.slice(0,i)].reverse().find(x=>!x.gone);
    const next=levels.slice(i+1).find(x=>!x.gone);
    l.anchors.forEach(a=>{ if(prev)link(a,"up",prev.anchors[prev.anchors.length-1]);
      if(next)link(a,"down",next.anchors[0]); });
  });
  const row=ids=>{ for(let i=0;i<ids.length-1;i++){ link(ids[i],"right",ids[i+1]); link(ids[i+1],"left",ids[i]); } };
  blocks.forEach(b=>{
    if(b.type==="actions"||b.type==="selectionbar")
      row((b.buttons||[]).map(x=>x.id).filter(Boolean));
    else if(b.type==="empty") row([b.primary_id,b.secondary_id].filter(Boolean));
  });
  return links;
}
function focusableIds(blocks, shown){
  const out=[];
  focusLevels(blocks,shown||{}).forEach(l=>{ if(!l.gone)out.push(...l.anchors); });
  return [...new Set(out)];
}
function defaultInitial(blocks){
  const lv=focusLevels(blocks,{});
  for(const l of lv) if(!l.gone&&l.anchors.length) return l.anchors[0];
  return "";
}

/* ---------- codegen (mirrors render.py) ---------- */
function escXml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;"); }
function escKt(s){ return String(s).replace(/\\/g,"\\\\").replace(/"/g,'\\"'); }
const DIR_ATTR={up:"Up",down:"Down",left:"Left",right:"Right"};
const BTN_BG={cta:"bg_cta",ghost:"bg_ghost",chip:"bg_chip_toggle",toggle:"bg_chip_toggle"};
const BTN_INK={cta:"cb_cta_ink",ghost:"cb_ink",chip:"cb_ink",toggle:"cb_ink"};
const BTN_SIZE={cta:"cb_text_body",ghost:"cb_text_body",chip:"cb_text_label",toggle:"cb_text_data"};

function applyDefaults(state){
  // Python-compatible defaults, no string extraction — safe for canvas/sim.
  const prefix=snake(state.screen)||"demo";
  const blocks=deep(state.blocks);
  blocks.forEach(b=>{
    const t=b.type;
    if(t==="header"){ b.kicker=b.kicker??"@string/kicker"; b.title=b.title??state.screen;
      if(b.showCount===undefined)b.showCount=true;
      if(b.showCount)b.count_id=b.count_id||(prefix+"_count"); }
    if(t==="search"||t==="filterrow") b.hint=b.hint??"@string/search_hint";
    if(t==="grid"){ b.source=b.source||"custom"; b.cellDp=b.cellDp||148; }
    if(t==="hero"){ b.title=b.title??state.screen; b.art=b.art||"@drawable/cb_banner"; }
    if(t==="updatebar"){ b.label=b.label??"Update available";
      b.sub=b.sub??"A newer build is ready to download."; b.button=b.button??"Download";
      b.button_id=b.button_id||((b.id||"update_bar")+"_button"); }
    if(t==="empty"){ b.title=b.title??"No results"; b.body=b.body??"Nothing matches this filter yet.";
      b.primary=b.primary??"Clear search"; b.secondary=b.secondary??"Show all";
      b.primary_id=b.primary_id||((b.id||"empty_state")+"_primary");
      b.secondary_id=b.secondary_id||((b.id||"empty_state")+"_secondary"); }
    if(t==="selectionbar"){ b.count=b.count??"0 selected"; b.selectAll=b.selectAll??"Select all";
      b.clear=b.clear??"Clear"; b.export=b.export??"Export";
      if(!(b.buttons||[]).length&&b.id)
        b.buttons=[{id:b.id+"_all",style:"toggle",_shares:"selectAll"},
          {id:b.id+"_clear",style:"toggle",_shares:"clear"},
          {id:b.id+"_export",style:"cta",_shares:"export"}]; }
    if(t==="hint") b.text=b.text??"Tip";
    if((t==="chips"||t==="filterrow")&&!b.fromCatalog){ b.keys=b.keys||["ALL"]; b.labels=b.labels||["All"]; }
  });
  return {blocks,prefix};
}
function normalizeForCodegen(state){

) : RecyclerView.Adapter<${state.screen}Adapter.VH>() {

    data class Row(
        val key: String,
        val title: String,
        val sub: String,
        val drawable: String = ""
    )

    class VH(view: View) : RecyclerView.ViewHolder(view) {
        val image: ImageView = view.findViewById(R.id.${p}_item_image)
        val title: TextView = view.findViewById(R.id.${p}_item_title)
        val sub: TextView = view.findViewById(R.id.${p}_item_sub)
    }

    init {
        setHasStableIds(true)
    }

    override fun getItemId(position: Int): Long = items[position].key.hashCode().toLong()

    override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
        val v = LayoutInflater.from(parent.context)
            .inflate(R.layout.item_${p}, parent, false)
        TvFocus.attach(v)
        return VH(v)
    }

    override fun onBindViewHolder(holder: VH, position: Int) {
        val item = items[position]
        val ctx = holder.image.context
        if (item.drawable.isNotEmpty()) {
            val id = ctx.resources.getIdentifier(item.drawable, "drawable", ctx.packageName)
            if (id != 0) holder.image.setImageResource(id)
        }
        holder.title.text = item.title
        holder.sub.text = item.sub
        holder.itemView.contentDescription = item.title
        holder.itemView.setOnClickListener { onActivate(item) }
    }

    override fun getItemCount() = items.size

    fun submit(next: List<Row>) {
        val previous = items
        val result = DiffUtil.calculateDiff(object : DiffUtil.Callback() {
            override fun getOldListSize() = previous.size
            override fun getNewListSize() = next.size
            override fun areItemsTheSame(old: Int, new: Int) =
                previous[old].key == next[new].key
            override fun areContentsTheSame(old: Int, new: Int) =
                previous[old] == next[new]
        })
        items = next
        result.dispatchUpdatesTo(this)
    }

    companion object {
        fun sampleRows(): List<Row> = listOf(
            Row("row_1", "First row", "subtitle", "cb_banner"),
            Row("row_2", "Second row", "subtitle", "cb_banner"),
            Row("row_3", "Third row", "subtitle", "cb_banner")
        )
    }
}
`;

function auditModel(state){
  const errors=[],warnings=[];
  const blocks=applyDefaults(state).blocks, ids=new Set(), dupes=new Set();
  blocks.forEach(b=>blockIds(b).forEach(id=>{ if(!id)return;
    if(ids.has(id))dupes.add(id); ids.add(id); }));
  const root=snake(state.screen)+"_root";
  if(ids.has(root))dupes.add(root);
  dupes.forEach(d=>errors.push(`@${d}: declared twice (ids must be unique)`));
  const bad=[...ids].filter(id=>!/^[a-z][a-z0-9_]*$/.test(id));
  bad.forEach(id=>errors.push(`@${id}: bad id (lowercase letters, digits, _)`));
  const links=computeLinks(blocks,{});
  Object.keys(links).forEach(v=>Object.keys(links[v]).forEach(d=>{
    if(!ids.has(links[v][d]))errors.push(`@${v}: nextFocus${DIR_ATTR[d]} points at @id/${links[v][d]}, which no block declares`); }));
  const vis=focusableIds(blocks,{});
  const start=(state.dpad&&state.dpad.initialFocus)||vis[0];
  if(!start) errors.push("no focusable view: D-pad has nowhere to land");
  else{
    if(!ids.has(start))errors.push(`initial focus "${start}" is not a declared id`);
    else if(!vis.includes(start))errors.push(`initial focus "${start}" sits inside a hidden bar`);
    else{
      const seen=new Set([start]),q=[start];
      while(q.length){ const cur=q.pop();
        Object.values(links[cur]||{}).forEach(n=>{ if(!seen.has(n)){seen.add(n);q.push(n);} }); }
      const inbound={}; Object.values(links).forEach(m=>Object.values(m).forEach(t=>inbound[t]=(inbound[t]||0)+1));
      vis.forEach(v=>{ if(v===start||seen.has(v))return;
        if(!links[v]&&!inbound[v]&&vis.length>1)errors.push(`@${v}: isolated — no nextFocus in or out`);
        else warnings.push(`@${v}: not reachable from @${start} over declared links (relies on spatial search)`); });
    }
  }
  if(!blocks.some(b=>b.type==="header"))errors.push('spec needs a "header" block');
  const nlinks=Object.values(links).reduce((n,m)=>n+Object.keys(m).length,0);
  return {errors,warnings,stats:{focusable:vis.length,links:nlinks,initial:start||"—"}};
}

  try{ const raw=localStorage.getItem("cb-ui-studio");
    if(raw){ const s=JSON.parse(raw);
      if(s&&s.screen&&Array.isArray(s.blocks)){ s.blocks.forEach(b=>{b.uid=b.uid||uid();}); return s; } } }catch(e){}

/* ---------- canvas ---------- */
function labelOf(v){
  if(isRef(v)) return v.slice(8).replace(/_/g," ");
  return v;
}
function tileSetFor(b){
  if(b.type==="grid")return {n:12,cols:6,labels:Array.from({length:12},(_,i)=>"App "+(i+1))};
  if(b.type==="chips")return {n:(b.fromCatalog?4:(b.labels||["All"]).length),cols:99,
    labels:b.fromCatalog?["All","Series 1","Series 2","Series 3"]:(b.labels||["All"])};
  if(b.type==="targets")return {n:3,cols:99,labels:["Projectivy","Monet","FLauncher"]};
  return null;
}
function NB(){ return applyDefaults(S).blocks; }
function renderCanvas(){
  const cv=$("#canvas"); cv.querySelectorAll(":scope > :not(#toast)").forEach(n=>n.remove());
  const wrap=document.createElement("div"); wrap.id="screen";
  NB().forEach(b=>{
    const gone=levelGone(b,shown);
    if(gone&&!shown[b.uid]){ const ph=document.createElement("div");
      ph.className="hidebox"; ph.textContent=`${b.type} · hidden — click to preview revealed`;
      ph.onclick=()=>{shown[b.uid]=true;refresh();}; wrap.appendChild(ph); return; }
    wrap.appendChild(blockHtml(b));

  cv.insertBefore(wrap,$("#toast"));
  applyAnimCss();
  if(!focusFid||!document.querySelector(`[data-fid="${CSS.escape(focusFid)}"]`))
    focusFid=resolveTarget((S.dpad&&S.dpad.initialFocus)||defaultInitial(NB()));
  paintFocus();
}

function escHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function applyAnimCss(){

/* ---------- focus sim ---------- */
function containers(){
  // id -> {kind:'chips'|'grid', n, cols}
  const m={};
  NB().forEach(b=>{
    if(b.type==="chips"&&b.id){ const n=b.fromCatalog?4:((b.labels&&b.labels.length)||1); m[b.id]={kind:"chips",n,cols:99}; }
    if(b.type==="filterrow"){ const n=b.fromCatalog?3:((b.labels&&b.labels.length)||1);
      if(b.chips_id)m[b.chips_id]={kind:"chips",n,cols:99}; }
    if(b.type==="targets"&&b.id&&(b.visible||shown[b.uid]))m[b.id]={kind:"chips",n:3,cols:99};
    if(b.type==="grid"&&b.id)m[b.id]={kind:"grid",n:12,cols:6}; });
  return m;
}
function resolveTarget(fid){
  if(!fid)return null;
  const c=containers();
  if(c[fid]){ const mem=lastTile[fid];
    if(mem!=null&&document.querySelector(`[data-fid="${fid}#${mem}"]`))return `${fid}#${mem}`;
    return `${fid}#0`; }
  return document.querySelector(`[data-fid="${CSS.escape(fid)}"]`)?fid:null;
}
function move(dir){
  if(!focusFid)return;
  const links=computeLinks(NB(),shown);
  const hash=focusFid.indexOf("#");
  let next=null;
  if(hash>0){
    const cid=focusFid.slice(0,hash), idx=+focusFid.slice(hash+1), c=containers()[cid];
    if(!c)return;
    if(dir==="left"&&idx%c.cols>0)next=`${cid}#${idx-1}`;
    else if(dir==="right"&&(idx+1)%c.cols!==0&&idx+1<c.n)next=`${cid}#${idx+1}`;
    else if(dir==="up"){ if(idx-c.cols>=0)next=`${cid}#${idx-c.cols}`;
      else if(links[cid]&&links[cid].up)next=resolveTarget(links[cid].up); }
    else if(dir==="down"){ if(idx+c.cols<c.n)next=`${cid}#${idx+c.cols}`;
      else if(links[cid]&&links[cid].down)next=resolveTarget(links[cid].down); }
  }else{
    const t=(links[focusFid]||{})[dir];
    if(t)next=resolveTarget(t);
  }
  if(next)setFocus(next);
}
function setFocus(fid){
  focusFid=fid;
  const h=fid.indexOf("#");
  if(h>0)lastTile[fid.slice(0,h)]=+fid.slice(h+1);
  paintFocus();
}
function paintFocus(){
  $$("#canvas .fv.focused").forEach(n=>n.classList.remove("focused"));
  const el=focusFid&&document.querySelector(`[data-fid="${CSS.escape(focusFid)}"]`);
  if(el){ el.classList.add("focused"); el.scrollIntoView({block:"nearest"}); }
  const links=computeLinks(NB(),shown);
  const base=focusFid&&focusFid.includes("#")?focusFid.slice(0,focusFid.indexOf("#")):focusFid;
  const L=links[base]||{};
  $("#focusread").innerHTML=`focus: <b>${escHtml(focusFid||"—")}</b>`+
    ["up","down","left","right"].map(d=>` · ${{up:"▲",down:"▼",left:"◀",right:"▶"}[d]} ${escHtml(L[d]||"—")}`).join("");
}
function toast(msg){
  const t=$("#toast");t.textContent=msg;t.style.display="block";
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",1400);
}
function playEnter(){
  const sc=$("#screen");sc.classList.remove("enterplay");void sc.offsetWidth;
  [...sc.children].forEach((c,i)=>c.style.animationDelay=(i*(S.anim.staggerMs||28))+"ms");
  sc.classList.add("enterplay");
}

function inspBlocks(el){
  S.blocks.forEach((b,i)=>{

  if(k==="manifest"){ const h=S.blocks.find(b=>b.type==="header")||{};
    const t=h.title||"@string/app_name";
    return `        <activity\n            android:name=".${S.screen}Activity"\n            android:exported="false"\n            android:label="${isRef(t)?t:"@string/app_name"}"\n            android:theme="@style/Theme.CoreBuilds" />\n`; }
  return "";
}
function copyText(t){
  const done=()=>toast("Copied to clipboard");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fallback());
  else fallback();
  function fallback(){ const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);
    ta.select();try{document.execCommand("copy");done();}catch(e){toast("Copy failed — select the code manually");}ta.remove(); }
}
function download(k){
  const prefix=snake(S.screen)||"demo";
  const names={layout:`activity_${prefix}.xml`,activity:`${S.screen}Activity.kt`,adapter:`${S.screen}Adapter.kt`,
    item:`item_${prefix}.xml`,strings:`strings_${prefix}.xml`,spec:`${prefix}_spec.json`,manifest:"manifest_snippet.xml"};
  const blob=new Blob([codeFor(k)],{type:"text/plain"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=names[k];a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function inspChecks(el){
  const a=auditModel(S);
  const stat=document.createElement("div");stat.className="chk "+(a.errors.length?"err":(a.warnings.length?"warn":"ok"));
  stat.innerHTML=`<b>${a.errors.length?"✕ ERRORS":(a.warnings.length?"⚠ WARNINGS":"✓ CLEAN")}</b>${a.stats.focusable} focusable · ${a.stats.links} links · initial @${a.stats.initial}`;
  el.appendChild(stat);
  a.errors.forEach(m=>{const d=document.createElement("div");d.className="chk err";d.innerHTML="<b>ERROR</b>"+escHtml(m);el.appendChild(d);});
  a.warnings.forEach(m=>{const d=document.createElement("div");d.className="chk warn";d.innerHTML="<b>WARN</b>"+escHtml(m);el.appendChild(d);});
  const n=document.createElement("div");n.style.cssText="color:var(--slate);font-size:11px;margin-top:6px";
  n.textContent="Same rules as tools/validate_ui.py. The CLI re-checks on --apply and refuses broken screens.";
  el.appendChild(n);
}
/* ---------- shell ---------- */
function renderPalette(){
  const p=$("#palette");p.innerHTML="";
  PALETTE.forEach(([type,lab,sub])=>{
    const b=document.createElement("button");b.className="palbtn";
    b.innerHTML=`<b>${lab}</b><span>${sub}</span>`;
    b.onclick=()=>{ if(type==="header"&&S.blocks.some(x=>x.type==="header")){toast("One header per screen");return;}
      const nb=defBlock(type);S.blocks.push(nb);selUid=nb.uid;tab="props";refresh(); };
    p.appendChild(b);
  });
}
function initShell(){
  const ps=$("#presetSel");
  Object.keys(PRESETS).forEach(k=>{const o=document.createElement("option");o.value=k;
    o.textContent=k+" → "+(PRESETS[k].screen||k);ps.appendChild(o);});
  ps.onchange=()=>{ S=freshState(ps.value);selUid=null;shown={};focusFid=null;lastTile={};
    $("#screenName").value=S.screen;refresh(); };
  $("#screenName").oninput=e=>{ const v=e.target.value.replace(/[^A-Za-z0-9]/g,"")||"Demo";
    S.screen=v;save();renderCanvas();if(tab==="code")renderInsp();renderStatus(); };
  $$("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderInsp();});
  $$("#remote button").forEach(b=>b.onclick=()=>remote(b.dataset.k));
  document.addEventListener("keydown",e=>{
    const tag=(e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"||tag==="select")return;
    const map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",Enter:"ok",Escape:"back"};
    if(map[e.key]){e.preventDefault();remote(map[e.key]);}
  });
  $("#specBtn").onclick=()=>{ codeTab="spec"; download("spec"); };
  $("#copyHint").onclick=()=>copyText(`python tools/build_ui.py --spec ${snake(S.screen)||"demo"}_spec.json --apply`);
  $("#loadSpecBtn").onclick=()=>$("#specFile").click();
  $("#specFile").onchange=e=>{ const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{ const raw=JSON.parse(r.result);
        if(!raw.screen||!Array.isArray(raw.blocks))throw new Error("need screen + blocks");
        S=Object.assign(freshState("browser"),raw);
        S.blocks.forEach(b=>{b.uid=uid();});
        selUid=null;shown={};focusFid=null;$("#screenName").value=S.screen;refresh();
        toast("Spec loaded"); }catch(err){ toast("Bad spec: "+err.message); } };
    r.readAsText(f); e.target.value=""; };
}
function remote(k){
  if(k==="ok"){ if(focusFid)toast("OK → "+focusFid); return; }
  if(k==="back"){ toast("Back"); return; }
  move(k);
}
/* ---------- boot ---------- */
async function boot(){
  try{
    const names=Object.keys(EMBEDDED), fresh={};
    for(const n of names){ const r=await fetch("screens/"+n+".json");
      if(!r.ok)throw new Error("http "+r.status); fresh[n]=await r.json(); }
    PRESETS=fresh;
  }catch(e){ /* file:// or offline: embedded copies stand in */ }
  initShell();renderPalette();
  S=load()||freshState("browser");
  S.anim=Object.assign({focusScale:1.06,itemScale:1.04,focusMs:160,enter:true,enterMs:220,staggerMs:28},S.anim||{});
  S.dpad=S.dpad||{};S.blocks.forEach(b=>{b.uid=b.uid||uid();});
  const known=Object.keys(PRESETS).find(k=>(PRESETS[k].screen||"")===S.screen);
  if(known)$("#presetSel").value=known;
  $("#screenName").value=S.screen;
  refresh();
  const first=S.blocks[0];if(first)selUid=first.uid;
  renderInsp();
}
boot();
}
</script>
