const VIEWS = DATA.views;

const DPR = Math.min(2, window.devicePixelRatio || 1);

const C = { void: '#04070f', panel: '#0d1117', hair: '#1d2735', ink: '#e8eef7',
            muted: '#8b98a9', cyan: '#00e5ff', violet: '#8a4890', ember: '#c03a20' };

// ---- helpers --------------------------------------------------------------

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

/** Linear interpolation between the samples Python generated. */
function sampleAt(view, time) {
  const s = view.samples;
  if (time <= s[0][0]) return s[0];
  if (time >= s[s.length - 1][0]) return s[s.length - 1];
  let lo = 0, hi = s.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (s[mid][0] <= time) lo = mid; else hi = mid;
  }
  const a = s[lo], b = s[hi];
  const k = (time - a[0]) / Math.max(1e-6, b[0] - a[0]);
  const mix = (i) => a[i] + (b[i] - a[i]) * k;
  // Bearing wraps at 360. Interpolate the short way, or an orbit passing north
  // snaps backwards through the whole circle on one frame.
  let delta = ((b[5] - a[5] + 540) % 360) - 180;
  const bearing = (a[5] + delta * k + 360) % 360;
  return [time, mix(1), mix(2), mix(3), mix(4), bearing, mix(6)];
}

function fitCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = Math.max(320, Math.floor(rect.width * DPR));
  canvas.height = Math.max(240, Math.floor((rect.height - 8) * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

// ---- drawing: plan view ---------------------------------------------------

function drawPlan(view, cam, box) {
  const [x, y, w, h] = box;
  ctx.fillStyle = C.panel;
  ctx.strokeStyle = C.hair;
  ctx.lineWidth = 1;
  roundRect(x, y, w, h, 14);
  ctx.fill();
  ctx.stroke();

  const lat0 = view.samples[0][2];
  const cos = Math.cos(lat0 * Math.PI / 180);
  const pts = view.samples.map((s) => [s[1] * cos, s[2]]);
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const spanX = Math.max(maxX - minX, 1e-6), spanY = Math.max(maxY - minY, 1e-6);
  const pad = 46;
  const scale = Math.min((w - pad * 2) / spanX, (h - pad * 2) / spanY);
  const cx = x + w / 2, cy = y + h / 2;
  const midX = (maxX + minX) / 2, midY = (maxY + minY) / 2;
  const px = (a) => cx + (a[0] - midX) * scale;
  const py = (a) => cy - (a[1] - midY) * scale;

  // the subject
  const subject = pts[0];
  ctx.beginPath();
  ctx.arc(px(subject), py(subject), 24, 0, Math.PI * 2);
  ctx.setLineDash([3, 5]);
  ctx.strokeStyle = C.hair;
  ctx.stroke();
  ctx.setLineDash([]);

  // the track
  ctx.beginPath();
  pts.forEach((p, i) => (i ? ctx.lineTo(px(p), py(p)) : ctx.moveTo(px(p), py(p))));
  ctx.strokeStyle = C.hair;
  ctx.lineWidth = 2;
  ctx.stroke();

  // travelled
  const upto = view.samples.filter((s) => s[0] <= cam[0]);
  if (upto.length > 1) {
    ctx.beginPath();
    upto.forEach((s, i) => {
      const p = [s[1] * cos, s[2]];
      i ? ctx.lineTo(px(p), py(p)) : ctx.moveTo(px(p), py(p));
    });
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  // start / end
  const a = pts[0], b = pts[pts.length - 1];
  ctx.beginPath(); ctx.arc(px(a), py(a), 5, 0, Math.PI * 2);
  ctx.fillStyle = C.void; ctx.fill(); ctx.strokeStyle = C.cyan; ctx.stroke();
  ctx.beginPath(); ctx.arc(px(b), py(b), 5, 0, Math.PI * 2);
  ctx.fillStyle = C.cyan; ctx.fill();

  // camera
  const here = [cam[1] * cos, cam[2]];
  const hx = px(here), hy = py(here);
  ctx.beginPath();
  ctx.arc(hx, hy, 7, 0, Math.PI * 2);
  ctx.fillStyle = C.cyan; ctx.fill();

  // heading tick: bearing 0 is north, screen north is up
  const heading = ((cam[5] % 360) + 360) % 360;     // samples are unwrapped
  const rad = (heading - 90) * Math.PI / 180;
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(hx + Math.cos(rad) * 22, hy + Math.sin(rad) * 22);
  ctx.strokeStyle = C.cyan; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = C.muted;
  ctx.font = '10px "Outfit", system-ui, sans-serif';
  ctx.fillText('TRACK · ' + view.move.toUpperCase(), x + 16, y + 24);
  const km = (maxY - minY) * 110.54;
  ctx.fillText(km < 1 ? 'under a kilometre across' : km.toFixed(1) + ' km across',
               x + 16, y + h - 14);
}

// ---- drawing: strip charts -------------------------------------------------

function drawSeries(view, cam, indexInCam, box, label, colour, unit) {
  const [x, y, w, h] = box;
  ctx.fillStyle = C.panel;
  ctx.strokeStyle = C.hair;
  ctx.lineWidth = 1;
  roundRect(x, y, w, h, 12);
  ctx.fill(); ctx.stroke();

  const values = view.samples.map((s) => s[indexInCam]);
  let lo = Math.min(...values), hi = Math.max(...values);
  if (Math.abs(hi - lo) < 1e-6) { lo -= 1; hi += 1; }
  const padV = (hi - lo) * 0.14;
  lo -= padV; hi += padV;

  const duration = view.duration;
  const gx = x + 40, gw = w - 56;
  const gy = y + 30, gh = h - 46;

  ctx.beginPath();
  view.samples.forEach((s, i) => {
    const px = gx + gw * (s[0] / duration);
    const py = gy + gh - gh * ((s[indexInCam] - lo) / (hi - lo));
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  });
  ctx.strokeStyle = colour; ctx.lineWidth = 2; ctx.stroke();

  // playhead
  const hx = gx + gw * (cam[0] / duration);
  const value = cam[indexInCam];
  const hy = gy + gh - gh * ((value - lo) / (hi - lo));
  ctx.beginPath();
  ctx.moveTo(hx, gy - 6); ctx.lineTo(hx, gy + gh + 6);
  ctx.strokeStyle = 'rgba(232,238,247,.18)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.arc(hx, hy, 4, 0, Math.PI * 2);
  ctx.fillStyle = colour; ctx.fill();

  ctx.fillStyle = C.muted;
  ctx.font = '10px "Outfit", system-ui, sans-serif';
  ctx.fillText(label.toUpperCase(), x + 12, y + 19);
  ctx.textAlign = 'right';
  ctx.fillStyle = C.ink;
  ctx.font = '11px "Outfit", system-ui, sans-serif';
  ctx.fillText(Math.round(value) + unit, x + w - 12, y + 19);
  ctx.textAlign = 'left';
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---- render ---------------------------------------------------------------

function draw() {
  const view = VIEWS[index];
  if (!view) return;
  const cam = sampleAt(view, t);
  const W = canvas.width / DPR, H = canvas.height / DPR;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = C.void;
  ctx.fillRect(0, 0, W, H);

  const gutter = 14;
  const planW = Math.min(W * 0.52, H * 1.15);
  drawPlan(view, cam, [0, 0, planW, H]);

  const rightX = planW + gutter;
  const rightW = W - rightX;
  const chartH = (H - gutter * 2) / 3;
  drawSeries(view, cam, 4, [rightX, 0, rightW, chartH], 'altitude', C.cyan, ' m');
  drawSeries(view, cam, 5, [rightX, chartH + gutter, rightW, chartH],
             'bearing', C.violet, '°');
  drawSeries(view, cam, 6, [rightX, (chartH + gutter) * 2, rightW, chartH],
             'pitch', C.ember, '°');
}

function updateCaption() {
  const view = VIEWS[index];
  const box = $('caption');
  if (!view) return;
  if (box.childElementCount !== view.captions.length) {
    box.textContent = '';
    for (const _ of view.captions) box.appendChild(document.createElement('div'));
  }
  view.captions.forEach((caption, i) => {
    const el = box.children[i];
    if (!el) return;
    el.textContent = caption[1];
    // Visible from its mark for six seconds, then out.
    const on = t >= caption[0] && t < caption[0] + 6;
    el.classList.toggle('on', on);
  });
}

function updateTransport() {
  const view = VIEWS[index];
  if (!view) return;
  const frac = clamp(t / view.duration, 0, 1);
  $('fill').style.width = (frac * 100) + '%';
  $('head').style.left = (frac * 100) + '%';
  $('clock').textContent = t.toFixed(1) + ' / ' + view.duration.toFixed(0) + ' s';
  const scrub = $('scrub');
  scrub.setAttribute('aria-valuemax', String(view.duration));
  scrub.setAttribute('aria-valuenow', String(Math.round(t * 10) / 10));
}

function tick(now) {
  if (!playing) return;
  if (!lastFrame) lastFrame = now;
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  const view = VIEWS[index];
  t += dt;
  if (t >= view.duration) {
    if (looping) {
      t = 0;
    } else {
      t = view.duration;
      setPlaying(false);
    }
  }
  draw(); updateCaption(); updateTransport();
  if (playing) requestAnimationFrame(tick);
}

function setPlaying(next) {
  playing = next;
  $('play').textContent = playing ? 'Pause' : 'Play';
  $('play').setAttribute('aria-pressed', playing ? 'true' : 'false');
  if (playing) {
    lastFrame = 0;
    requestAnimationFrame(tick);
  }
}

// ---- selection ------------------------------------------------------------

function select(nextIndex, { keepTime = false } = {}) {
  index = clamp(nextIndex, 0, VIEWS.length - 1);
  if (!keepTime) t = 0;
  const view = VIEWS[index];

  $('title').textContent = view.title;
  $('place').textContent = view.place;

  const chips = $('chips');
  chips.textContent = '';
  const add = (label, value, warn) => {
    const span = document.createElement('span');
    span.className = 'chip' + (warn ? ' warn' : '');
    span.innerHTML = label + ' <b>' + value + '</b>';
    chips.appendChild(span);
  };
  add('time', view.time);
  add('scene', view.scene);
  add('move', view.move);
  add('length', view.duration.toFixed(0) + 's');
  add('frames', Math.round(view.duration * view.fps) + ' @ ' + view.fps + 'fps');
  add('credits', String(view.credits.length));

  document.querySelectorAll('.item').forEach((el, i) => {
    el.setAttribute('aria-current', i === index ? 'true' : 'false');
  });

  draw(); updateCaption(); updateTransport(); drawTicks();
}

// ---- build the list -------------------------------------------------------

function buildList() {
  const list = $('list');
  VIEWS.forEach((view, i) => {
    const button = document.createElement('button');
    button.className = 'item';
    button.setAttribute('role', 'option');
    button.innerHTML =
      '<span class="n">' + String(view.n).padStart(2, '0') + '</span>' +
      '<span class="t">' + view.title +
      '<span class="m">' + view.region + ' · ' + view.move + '</span></span>';
    button.addEventListener('click', () => { select(i); setPlaying(false); });
    list.appendChild(button);
  });
  for (const view of SKIPPED) {
    const div = document.createElement('div');
    div.className = 'item off';
    div.setAttribute('role', 'option');
    div.setAttribute('aria-disabled', 'true');
    div.innerHTML =
      '<span class="n">' + String(view.n).padStart(2, '0') + '</span>' +
      '<span class="t">' + view.title +
      '<span class="m">' + view.lane + ' — no camera move</span></span>';
    list.appendChild(div);
  }
  const note = $('note');
  note.innerHTML = 'Shot cards are camera and captions only — no imagery. ' +
    'Every sample comes from <code>tools/views_geo.py</code>, the same function ' +
    'the renderer flies. Render with ' +
    '<code>python tools/render_views.py --only ' + VIEWS[0].id + '</code>.';
}

// ---- wiring ---------------------------------------------------------------

function scrubTo(clientX) {
  const rect = $('scrub').getBoundingClientRect();
  const frac = clamp((clientX - rect.left) / rect.width, 0, 1);
  t = frac * VIEWS[index].duration;
  draw(); updateCaption(); updateTransport();
}

$('play').addEventListener('click', () => setPlaying(!playing));
$('restart').addEventListener('click', () => {
  t = 0; draw(); updateCaption(); updateTransport();
});
$('loop').addEventListener('click', (e) => {
  looping = !looping;
  e.target.textContent = 'Loop ' + (looping ? 'on' : 'off');
  e.target.setAttribute('aria-pressed', String(looping));
});

const scrub = $('scrub');
let dragging = false;
scrub.addEventListener('pointerdown', (e) => {
  dragging = true; scrub.setPointerCapture(e.pointerId); scrubTo(e.clientX);
});
scrub.addEventListener('pointermove', (e) => { if (dragging) scrubTo(e.clientX); });
scrub.addEventListener('pointerup', () => { dragging = false; });

// Caption ticks on the timeline. Declared as a function so select() can call it
// on every change without a second wiring path.
function drawTicks() {
  const view = VIEWS[index];
  scrub.querySelectorAll('.tick').forEach((n) => n.remove());
  for (const [at] of view.captions) {
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.style.left = (100 * at / view.duration) + '%';
    tick.title = at + 's';
    scrub.appendChild(tick);
  }
}

document.addEventListener('keydown', (e) => {
  if (e.target instanceof Element && e.target.closest('input, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  if (e.key === 'ArrowRight') select(index + 1);
  if (e.key === 'ArrowLeft') select(index - 1);
  if (e.key === 'Home') { t = 0; draw(); updateCaption(); updateTransport(); }
});

window.addEventListener('resize', () => { fitCanvas(); draw(); });

buildList();
fitCanvas();
select(0);
</script>
</body>
</html>
