org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 changed this default from false to true - "Only creates unit test
# components for the tested build type. In the default project this results in
# a single unit test for debug, where the previous behaviour was to have unit
# tests run for debug or release" (AGP 9.0 release notes). This root is on AGP
# 9.4.0 and its workflows name two non-debug unit-test tasks:
# `:app:testBannersCandidateUnitTest` for the restricted test channel and
# `:app:testBannersReleaseUnitTest` for a published icon pack. Both tasks
# stopped existing the moment the toolchain moved, and Gradle fails at task
# selection before it compiles anything - which is how the test channel died on
# 2026-10-24 with "Cannot locate tasks that match
# ':app:testBannersCandidateUnitTest'". Setting this false restores AGP 8's
# behaviour: a unit-test component per build type, so the tests run against the
# variant that actually ships. The roots still on AGP 8.5.2 (shift/, doctor/,
# motion-plugin/, ticker/android/) do not need it and do not set it.
# tests/test_gradle_unit_test_variants.py holds all of that in place.
android.onlyEnableUnitTestForTheTestedBuildType=false
